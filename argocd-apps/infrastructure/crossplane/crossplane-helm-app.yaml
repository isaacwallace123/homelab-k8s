# Crossplane core control plane. Installs the Crossplane CRDs (Provider, Function,
# CompositeResourceDefinition, Composition, DeploymentRuntimeConfig) and the package manager.
#
# Providers, functions, the ProviderConfig, and the platform API (XRD + Composition) are applied
# separately by the crossplane-config and homeops-platform git descriptors, at later sync waves.
#
# Chart version == Crossplane version; Renovate keeps it current. Crossplane 2.x: the platform API
# here uses the v2 model (a scope: Cluster CompositeResourceDefinition, no claims) composed by
# function-patch-and-transform. Verify the pin against https://charts.crossplane.io/stable.
name: crossplane
namespace: crossplane-system
project: infrastructure
syncWave: "-4"
repoURL: https://charts.crossplane.io/stable
chart: crossplane
targetRevision: "2.3.3"
values: |
  args:
    # A LabRun is watched by a human staring at a launch screen, not by a reconcile loop that can
    # afford to be a minute stale. The default 1m per-resource poll is what a launch phase costs to
    # detect when the realtime watch does not fire: composed Objects go ready in seconds, then the XR
    # sits until its next tick before it will report Ready, once per gate. 10s is the smallest
    # interval that is still cheap here — one XR and 28 composed Objects, far under the circuit
    # breaker's 1 token/s refill.
    - --poll-interval=10s
    # Sizing the XR circuit breaker for what provisioning a LabRun actually looks like.
    #
    # Composing one costs 28 Objects, and every one of them churns its status while the thing it
    # wraps settles — five Deployments moving through replica counts and conditions account for most
    # of it. Realtime composition turns each of those into a watch event on the XR, so an ordinary,
    # healthy provision arrives as a burst of roughly a hundred, which is exactly the default bucket.
    # Tripping it cost far more than it saved: every composed Object was Ready in 14s and the LabRun
    # did not report Ready until 70s, because the breaker had opened and was releasing reconciles on
    # its cooldown. The operator waits out that gap staring at a cluster that is already serving.
    #
    # So the bucket absorbs a provision several times over, while the refill rate — the sustained
    # ceiling, and the thing that actually protects the control plane — stays low enough that a
    # genuine runaway is still throttled. A runaway is sustained; a provision is not.
    - --circuit-breaker-burst=500
    - --circuit-breaker-refill-rate=5
    # And if it does trip, recovery is measured in seconds. Five minutes of throttled reconciles is
    # far longer than any burst it is protecting against.
    - --circuit-breaker-cooldown=30s
  metrics:
    enabled: true
  resourcesCrossplane:
    limits:
      cpu: 500m
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 256Mi
