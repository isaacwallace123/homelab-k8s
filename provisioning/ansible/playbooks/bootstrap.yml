---
# =============================================================================
# bootstrap.yml — Node-level prerequisites for the k3s cluster
#
# Run against all workers before syncing Longhorn:
#   ansible-playbook playbooks/bootstrap.yml --limit agent
#
# Run against all nodes:
#   ansible-playbook playbooks/bootstrap.yml
# =============================================================================

- name: Bootstrap k3s nodes
  hosts: k3s_cluster
  become: true
  gather_facts: true

  tasks:

    # -------------------------------------------------------------------------
    # System packages
    # -------------------------------------------------------------------------
    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      apt:
        name:
          - open-iscsi       # Required by Longhorn for block storage volumes
          - nfs-common       # NFS client — mounts /tank/media from 192.168.0.252
          - curl
          - jq
        state: present

    # -------------------------------------------------------------------------
    # iSCSI — required by Longhorn
    # -------------------------------------------------------------------------
    - name: Enable and start iscsid
      systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Load iscsi_tcp kernel module
      modprobe:
        name: iscsi_tcp
        state: present

    - name: Persist iscsi_tcp across reboots
      copy:
        dest: /etc/modules-load.d/iscsi.conf
        content: "iscsi_tcp\n"
        mode: "0644"

    # multipathd (on by default in Ubuntu) claims Longhorn's iSCSI disks as mpathX maps, and
    # then nothing can mount them: "already mounted or mount point busy" with nothing mounted,
    # and "Can't open blockdev" in dmesg. It left portfolio/auth-service unable to start for
    # 35 hours. Longhorn's documented fix: multipath leaves sd* devices alone. These VMs have no
    # multipath storage of their own.
    - name: Keep multipathd off Longhorn's disks
      copy:
        dest: /etc/multipath.conf
        content: |
          defaults {
              user_friendly_names yes
          }
          blacklist {
              devnode "^sd[a-z0-9]+"
          }
        mode: "0644"
      register: multipath_conf

    - name: Restart multipathd after a change
      systemd:
        name: multipathd
        state: restarted
      when: multipath_conf.changed

    # -------------------------------------------------------------------------
    # NFS mount — /tank on 192.168.0.252 → /mnt/tank
    # -------------------------------------------------------------------------
    - name: Create NFS mount point
      file:
        path: /mnt/tank
        state: directory
        mode: "0755"

    - name: Mount /tank/config from NFS server
      mount:
        path: /mnt/tank
        src: 192.168.0.252:/mnt/tank
        fstype: nfs
        opts: defaults,_netdev,nofail
        state: mounted

    # -------------------------------------------------------------------------
    # Longhorn data directory
    # -------------------------------------------------------------------------
    - name: Create Longhorn default data directory
      file:
        path: /var/lib/longhorn
        state: directory
        mode: "0750"

# =============================================================================
# Label worker nodes — runs on the control plane using kubectl.
# k3s-worker-node-2 gets node-role.kubernetes.io/worker=true so Longhorn,
# media apps, and monitoring all schedule there instead of the AI-only node.
# =============================================================================
- name: Label k3s worker nodes for workload scheduling
  hosts: server
  become: true
  gather_facts: false

  tasks:
    - name: Label k3s-worker-node-2 as general worker (non-AI workloads)
      command: kubectl label node k3s-worker-node-2 node-role.kubernetes.io/worker=true --overwrite
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: result
      changed_when: "'labeled' in result.stdout"
