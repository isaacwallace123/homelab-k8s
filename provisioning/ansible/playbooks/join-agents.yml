---
# =============================================================================
# join-agents.yml — Install k3s on worker nodes and join them to the cluster.
#
#   ansible-playbook playbooks/join-agents.yml
#   ansible-playbook playbooks/join-agents.yml --limit k8s-cloud-01
#
# Per-node kubelet arguments come from the inventory, which Terraform generates from
# var.nodes. Some kubelet settings cannot be changed on a node that is already running
# workloads without draining it first, so they have to be set at join time.
# =============================================================================

- name: Prepare worker nodes
  hosts: agent
  become: true
  gather_facts: true

  tasks:
    - name: Install node prerequisites
      ansible.builtin.apt:
        name:
          - open-iscsi # Longhorn block volumes
          - nfs-common # TrueNAS NFS mounts
          - jq
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure iscsid is running
      ansible.builtin.systemd:
        name: iscsid
        state: started
        enabled: true

    # k3s's built-in local-path provisioner writes here. Kept because k3s ships it
    # enabled; no StorageClass in this repo targets it any more.
    - name: Create the local-path data directory
      ansible.builtin.file:
        path: /var/lib/rancher/k3s/storage
        state: directory
        mode: "0755"

- name: Join workers to the cluster
  hosts: agent
  become: true
  gather_facts: false

  tasks:
    - name: Check whether k3s is already installed
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary

    - name: Skip nodes that are already joined
      ansible.builtin.meta: end_host
      when: k3s_binary.stat.exists

    - name: Ensure the k3s config directory exists
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: "0755"

    - name: Write the agent config
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: "0600"
        content: |
          # Managed by Ansible — provisioning/ansible/playbooks/join-agents.yml
          server: "https://{{ primary_server_ip }}:6443"
          token: "{{ k3s_token }}"
          # `node-role.kubernetes.io/*` is deliberately filtered out here. The kubelet
          # refuses to self-assign labels in restricted kubernetes.io namespaces and
          # exits rather than starting:
          #
          #   Error: failed to validate kubelet flags: unknown 'kubernetes.io' or 'k8s.io'
          #   labels specified with --node-labels: [node-role.kubernetes.io/worker]
          #
          # Every node in terraform.tfvars carries that label, so without this filter no
          # new node can join at all -- k3s-agent installs and then fails to start.
          # node-topology.yml applies these afterwards with `kubectl label`, which is the
          # only route the API server accepts them by.
          node-label:
            - "topology.kubernetes.io/zone={{ node_zone }}"
            - "homelab.isaacwallace.dev/pool={{ node_pool }}"
          {% for k, v in (node_labels | default({})).items() if not k.startswith('node-role.kubernetes.io/') %}
            - "{{ k }}={{ v }}"
          {% endfor %}
          {% if node_taints | default([]) | length > 0 %}
          node-taint:
          {% for t in node_taints %}
            - "{{ t }}"
          {% endfor %}
          {% endif %}
          {% if node_kubelet_args | default([]) | length > 0 %}
          kubelet-arg:
          {% for a in node_kubelet_args %}
            - "{{ a }}"
          {% endfor %}
          {% endif %}

    - name: Install k3s as an agent
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          curl -sfL https://get.k3s.io \
            | INSTALL_K3S_VERSION="{{ k3s_version }}" INSTALL_K3S_EXEC="agent" sh -
        executable: /bin/bash
        creates: /usr/local/bin/k3s

    - name: Wait for the node to report Ready
      ansible.builtin.command:
        cmd: >-
          k3s kubectl get node {{ inventory_hostname }}
          -o jsonpath={.status.conditions[?(@.type=="Ready")].status}
      delegate_to: "{{ groups['server'][0] }}"
      become: true
      register: node_ready
      changed_when: false
      retries: 30
      delay: 10
      until: node_ready.stdout == "True"
