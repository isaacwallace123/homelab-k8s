name: Validate Manifests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: kubeconform + YAML lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -fsSL \
            -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  /tmp/kubeconform.tar.gz" \
            | sha256sum -c -
          tar xzf /tmp/kubeconform.tar.gz -C /tmp
          sudo mv /tmp/kubeconform /usr/local/bin/

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install Python validators
        run: pip install yamllint pyyaml

      # The "Validate Terraform" step below has never run: nothing installed the binary,
      # so it exited 127 with "terraform: command not found". Earlier steps in this job
      # failed first for long enough that it was never reached.
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Lint YAML syntax
        # platform/**/templates is excluded: those are Helm templates, not YAML, and a
        # linter reading `{{- range }}` as a document is noise rather than signal.
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}}}' \
            bootstrap/ platform/values/ platform/components/*/values/
          find platform/components -path '*/templates' -prune -o -name '*.yaml' -print \
            | xargs yamllint -d '{extends: relaxed, rules: {line-length: {max: 200}}}'

      - name: Render the platform chart and check every component resolves
        # Catches a values entry pointing at a directory that does not exist, a templated
        # component missing its Chart.yaml or env values file, and any template error.
        run: ./scripts/validate-platform.sh

      - name: Test-render the Crossplane Compositions
        # function-go-templating uses the same engine as Helm, so the inline templates can
        # be rendered against mock composites. Without this a broken Composition is only
        # discovered when it silently composes nothing.
        run: ./scripts/test-compositions.sh

      - name: Validate Kubernetes manifests
        # `values` directories and Chart.yaml are pruned alongside `templates`. They are
        # Helm inputs, not Kubernetes objects, so they have no `kind` and kubeconform
        # counts each one as an error rather than skipping it. yamllint already covers
        # them for syntax.
        run: |
          helm template platform platform -f platform/values/values-prod.yaml > /tmp/apps.yaml
          kubeconform \
            -strict \
            -ignore-missing-schemas \
            -summary \
            -skip "SealedSecret,Application,ApplicationSet,AppProject,ClusterIssuer,Certificate,GpuDevicePlugin,RecurringJob,HTTPRoute,TLSRoute,Gateway,GatewayClass,IPAddressPool,L2Advertisement,CompositeResourceDefinition,Composition,Provider,Function,ProviderConfig,DeploymentRuntimeConfig,Object" \
            -ignore-filename-pattern '\.argocd-source-.*\.yaml' \
            -kubernetes-version 1.34.0 \
            /tmp/apps.yaml bootstrap/ \
            $(find platform/components \
                \( -path '*/templates' -o -path '*/values' \) -prune -o \
                -name 'Chart.yaml' -prune -o \
                -name '*.yaml' -print)

      - name: Validate Terraform
        run: |
          terraform -chdir=provisioning/terraform init -backend=false -input=false
          terraform -chdir=provisioning/terraform validate
          terraform -chdir=provisioning/terraform fmt -check -recursive

  scan-homeops-images:
    name: trivy — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            image: cgr.dev/chainguard/postgres:latest@sha256:7ec87651dd1aef191b990ac02678adbd4b9554dee3f6fc08b8f91568fef26c59
          - name: redis
            image: cgr.dev/chainguard/redis:latest@sha256:2257ec2f6ea8b6c8664518b83a2274b72c0672633466a079d8a6c3c5d6fb7833
          - name: checkout
            image: ghcr.io/isaacwallace123/portfolio-checkout-demo:b9f89a3@sha256:c95b94387b53bb16e3d06bde699cb0783bed0a9944b151f5dc233156bfc9b19c
          - name: envoy
            image: envoyproxy/envoy:distroless-v1.38.0@sha256:a7a56545102f7a682e0cafea2c9b8448af1b09ebb710eab688dfb931e3ec7ff6
          - name: k6
            image: grafana/k6:master@sha256:c746f66b57ac51d5e28aebe0e96a6f71beb165599e29cbe3605d56f7eb8402dd
            # Accepted until k6 ships a build on Go 1.27.2 / x/net 0.60 (no published k6 image
            # has one on 2026-10-09). All four are denial of service in the HTTP stack of a load
            # generator that lives only inside a lab run's namespace. They lapse on the date, so
            # the scan fails again if k6 has not caught up.
            accept: CVE-2026-78667 CVE-2026-78669 CVE-2026-97031
            accept_until: "2026-11-09"
    steps:
      - name: Reject fixable high and critical vulnerabilities
        env:
          ACCEPT: ${{ matrix.accept }}
          UNTIL: ${{ matrix.accept_until }}
        run: |
          : > "$RUNNER_TEMP/trivyignore"
          for id in $ACCEPT; do echo "$id exp:$UNTIL" >> "$RUNNER_TEMP/trivyignore"; done
          docker run --rm -v "$RUNNER_TEMP/trivyignore:/trivyignore:ro" \
            aquasec/trivy@sha256:3d1f862cb6c4fe13c1506f96f816096030d8d5ccdb2380a3069f7bf07daa86aa \
            image --quiet --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
            --ignorefile /trivyignore \
            "${{ matrix.image }}"
