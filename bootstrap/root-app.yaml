# Root Application — the single entry point for the entire GitOps chain.
#
# Apply once, by hand, after installing ArgoCD:
#   kubectl apply -f bootstrap/root-app.yaml
#
# From there the platform chart renders every AppProject and every Application. Nothing
# else is ever applied manually.
#
# BEFORE APPLYING THIS ON THE EXISTING CLUSTER, read scripts/pre-cutover.sh. The
# restructure renames most Applications, and to ArgoCD a rename is a delete plus a create
# — with prune finalizers still attached that would cascade-delete their resources.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/isaacwallace123/homelab-k8s.git
    targetRevision: main
    path: platform
    helm:
      valueFiles:
        - values/values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: -1
