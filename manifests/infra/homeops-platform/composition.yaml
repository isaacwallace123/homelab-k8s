# checkout-traffic-spike — the first scenario Composition.
#
# Turns a LabRun into a disposable namespace with isolation primitives in place BEFORE any workload
# (ResourceQuota, LimitRange, default-deny NetworkPolicy), then a REAL, self-contained three-tier
# workload inside that boundary:
#
#   k6 (real load) → Envoy (gateway + metrics source) → checkout-demo → Postgres, with a Redis cache.
#
# checkout-demo does honest, load-dependent work (a pool-limited pg_sleep query), so under k6's load
# the service saturates and Envoy measures real request rate, latency percentiles, and 5xx. The
# operator decisions relieve it for real: scaling adds replicas (spec.apiReplicas → more pooled DB
# connections), and the cache brings up Redis (spec.cacheReplicas) which the app serves from,
# skipping the DB. Nothing here is modelled — the arena reads Envoy's numbers.
#
# The audited substrate is shared by four scenarios. The broker selects bounded initial values;
# decisions patch only the allowlisted fields exposed by the LabRun XRD.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: checkout-traffic-spike
  labels:
    platform.homelab.isaacwallace.dev/scenario: checkout-traffic-spike
spec:
  compositeTypeRef:
    apiVersion: platform.homelab.isaacwallace.dev/v1alpha1
    kind: LabRun
  mode: Pipeline
  pipeline:
    - step: render
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        patchSets:
          - name: namespaced
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.runId
                toFieldPath: spec.forProvider.manifest.metadata.namespace
        resources:
          # ── disposable namespace ──────────────────────────────────────────
          - name: namespace
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef:
                  name: homeops
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Namespace
                    metadata:
                      name: ""
                      labels:
                        homeops.isaacwallace.dev/managed: "true"
                        homeops.isaacwallace.dev/kind: run
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: spec.runId
                toFieldPath: metadata.name
                transforms:
                  - type: string
                    string: { type: Format, fmt: "%s-ns" }
              - type: FromCompositeFieldPath
                fromFieldPath: spec.runId
                toFieldPath: spec.forProvider.manifest.metadata.name
              - type: FromCompositeFieldPath
                fromFieldPath: spec.scenarioId
                toFieldPath: spec.forProvider.manifest.metadata.labels[homeops.isaacwallace.dev/scenario]
              - type: ToCompositeFieldPath
                fromFieldPath: spec.forProvider.manifest.metadata.name
                toFieldPath: status.namespace

          # Namespace-sensitive observability is granted only inside this disposable run.
          - name: broker-observer-role
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: rbac.authorization.k8s.io/v1
                    kind: Role
                    metadata: { name: homeops-run-observer, namespace: "" }
                    rules:
                      - apiGroups: [""]
                        resources: [pods, events]
                        verbs: [get, list]
                      - apiGroups: [""]
                        resources: [pods/log]
                        verbs: [get]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-observer-role" } }] }

          - name: broker-observer-binding
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: rbac.authorization.k8s.io/v1
                    kind: RoleBinding
                    metadata: { name: homeops-run-observer, namespace: "" }
                    roleRef:
                      apiGroup: rbac.authorization.k8s.io
                      kind: Role
                      name: homeops-run-observer
                    subjects:
                      - { kind: ServiceAccount, name: homeops-broker, namespace: portfolio }
                      - { kind: ServiceAccount, name: homeops-broker, namespace: homeops }
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-observer-binding" } }] }

          # ── resource envelope + per-container ceilings + network baseline ──
          - name: resourcequota
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ResourceQuota
                    metadata: { name: run-quota, namespace: "" }
                    # Sized so that every position of every control the UI exposes actually fits.
                    # At maximum — 6 checkout + 3 canary (250m each), 4 k6 generators (800m each),
                    # Postgres 500m, 3 Envoy gateways (300m each), Redis 200m — a run asks for 7050m
                    # of limits, so a 4-core ceiling silently refused the last three load generators
                    # with FailedCreate and they sat pending forever. Scheduling is unaffected: the
                    # same run requests about 1200m, and limits are a ceiling, not a reservation.
                    # Memory follows the open-loop k6 script: 200 max VUs need headroom above the
                    # old 512Mi, so four generators alone can claim 3Gi of the ceiling.
                    spec:
                      hard:
                        requests.cpu: "4"
                        requests.memory: 6Gi
                        limits.cpu: "8"
                        limits.memory: 8Gi
                        pods: "24"
                        count/services: "10"
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-quota" } }] }

          - name: limitrange
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: LimitRange
                    metadata: { name: run-limits, namespace: "" }
                    spec:
                      limits:
                        - type: Container
                          default: { cpu: 500m, memory: 512Mi }
                          defaultRequest: { cpu: 50m, memory: 64Mi }
                          max: { cpu: "2", memory: 2Gi }
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-limits" } }] }

          - name: networkpolicy-default-deny
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata: { name: default-deny, namespace: "" }
                    spec:
                      podSelector: {}
                      policyTypes: [Ingress, Egress]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-default-deny" } }] }

          - name: networkpolicy-allow-intra
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata: { name: allow-intra, namespace: "" }
                    spec:
                      podSelector: {}
                      policyTypes: [Ingress]
                      ingress: [{ from: [{ podSelector: {} }] }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-allow-intra" } }] }

          # Egress is expressed per request-path edge instead of one namespace-wide allow. That
          # makes the networkMode dial a real NetworkPolicy fault: db-blocked removes only the
          # checkout -> Postgres edge while DNS, Redis, gateway, and load-generator traffic remain.
          - name: networkpolicy-checkout-redis-egress
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata: { name: checkout-redis-egress, namespace: "" }
                    spec:
                      podSelector:
                        matchExpressions:
                          - { key: app, operator: In, values: [checkout, checkout-canary] }
                      policyTypes: [Egress]
                      egress:
                        - to: [{ podSelector: { matchLabels: { app: redis } } }]
                          ports: [{ protocol: TCP, port: 6379 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-checkout-redis-egress" } }] }

          - name: networkpolicy-checkout-postgres-egress
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata: { name: checkout-postgres-egress, namespace: "" }
                    spec:
                      podSelector: { matchLabels: { homeops-db-network: normal } }
                      policyTypes: [Egress]
                      egress:
                        - to: [{ podSelector: { matchLabels: { app: postgres } } }]
                          ports: [{ protocol: TCP, port: 5432 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-checkout-postgres-egress" } }] }

          - name: networkpolicy-envoy-checkout-egress
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata: { name: envoy-checkout-egress, namespace: "" }
                    spec:
                      podSelector: { matchLabels: { app: envoy } }
                      policyTypes: [Egress]
                      egress:
                        - to: [{ podSelector: { matchLabels: { tier: checkout } } }]
                          ports: [{ protocol: TCP, port: 8080 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-envoy-checkout-egress" } }] }

          - name: networkpolicy-k6-envoy-egress
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata: { name: k6-envoy-egress, namespace: "" }
                    spec:
                      podSelector: { matchLabels: { app: k6 } }
                      policyTypes: [Egress]
                      egress:
                        - to: [{ podSelector: { matchLabels: { app: envoy } } }]
                          ports: [{ protocol: TCP, port: 8080 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-k6-envoy-egress" } }] }

          - name: networkpolicy-allow-dns
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata: { name: allow-dns, namespace: "" }
                    spec:
                      podSelector: {}
                      policyTypes: [Egress]
                      egress:
                        - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
                          ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-allow-dns" } }] }

          # ── allow the run-broker to scrape Envoy's admin stats port ───────
          # Scoped to Envoy's admin port only (9901). This CNI (kube-router) does not reliably match
          # cross-namespace namespaceSelector, so the rule is port-scoped: any in-cluster pod may read
          # stats, but the run is a disposable sandbox and only the broker resolves this service.
          - name: networkpolicy-allow-scrape
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata: { name: allow-scrape, namespace: "" }
                    spec:
                      podSelector: { matchLabels: { app: envoy } }
                      policyTypes: [Ingress]
                      ingress:
                        - ports: [{ protocol: TCP, port: 9901 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-allow-scrape" } }] }

          # The broker reads one sanitized OpenTelemetry trace from checkout's internal endpoint.
          - name: networkpolicy-allow-trace-scrape
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: networking.k8s.io/v1
                    kind: NetworkPolicy
                    metadata: { name: allow-trace-scrape, namespace: "" }
                    spec:
                      podSelector: { matchLabels: { app: checkout } }
                      policyTypes: [Ingress]
                      ingress:
                        - ports: [{ protocol: TCP, port: 8080 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-allow-trace-scrape" } }] }

          # ── Postgres (the data tier the checkout query hits) ──────────────
          - name: postgres-deployment
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata: { name: postgres, namespace: "", labels: { app: postgres } }
                    spec:
                      replicas: 1
                      selector: { matchLabels: { app: postgres } }
                      template:
                        metadata: { labels: { app: postgres } }
                        spec:
                          automountServiceAccountToken: false
                          securityContext: { seccompProfile: { type: RuntimeDefault } }
                          terminationGracePeriodSeconds: 3
                          containers:
                            - name: postgres
                              image: cgr.dev/chainguard/postgres:latest@sha256:dc2f04037c1044a22af76cee4de70b9111885b17c561b939d7ed70103d100759
                              securityContext: { allowPrivilegeEscalation: false }
                              env:
                                - { name: POSTGRES_USER, value: checkout }
                                - { name: POSTGRES_PASSWORD, value: checkout }
                                - { name: POSTGRES_DB, value: checkout }
                                - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
                              ports: [{ containerPort: 5432 }]
                              readinessProbe:
                                exec:
                                  command: ["pg_isready", "-U", "checkout", "-d", "checkout"]
                                initialDelaySeconds: 1
                                periodSeconds: 1
                                timeoutSeconds: 2
                                failureThreshold: 30
                              resources:
                                requests: { cpu: 100m, memory: 128Mi }
                                limits: { cpu: 500m, memory: 512Mi }
                              volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
                          volumes: [{ name: data, emptyDir: {} }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-postgres" } }] }

          - name: postgres-service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
                    metadata: { name: postgres, namespace: "" }
                    spec:
                      selector: { app: postgres }
                      ports: [{ port: 5432, targetPort: 5432 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-postgres-svc" } }] }

          # ── Redis cache tier (scaled 0→1 by the cache decision) ───────────
          - name: redis-deployment
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata: { name: redis, namespace: "", labels: { app: redis } }
                    spec:
                      replicas: 0
                      selector: { matchLabels: { app: redis } }
                      template:
                        metadata: { labels: { app: redis } }
                        spec:
                          automountServiceAccountToken: false
                          securityContext: { seccompProfile: { type: RuntimeDefault } }
                          terminationGracePeriodSeconds: 3
                          containers:
                            - name: redis
                              image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
                              securityContext: { allowPrivilegeEscalation: false }
                              ports: [{ containerPort: 6379 }]
                              resources:
                                requests: { cpu: 50m, memory: 32Mi }
                                limits: { cpu: 200m, memory: 128Mi }
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-redis" } }] }
              - { type: FromCompositeFieldPath, fromFieldPath: spec.cacheReplicas, toFieldPath: spec.forProvider.manifest.spec.replicas }

          - name: redis-service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
                    metadata: { name: redis, namespace: "" }
                    spec:
                      selector: { app: redis }
                      ports: [{ port: 6379, targetPort: 6379 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-redis-svc" } }] }

          # ── checkout-demo (replica count = the scale decision) ────────────
          - name: checkout-deployment
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata: { name: checkout, namespace: "", labels: { app: checkout } }
                    spec:
                      # Overwritten from spec.apiReplicas on every reconcile; this only matters
                      # before the first patch lands, so it matches the sandbox baseline.
                      replicas: 1
                      selector: { matchLabels: { app: checkout } }
                      template:
                        metadata:
                          # `tier` is what the gateway's backend pool selects on, so the canary
                          # Deployment can put pods into the same pool without this Deployment's
                          # (immutable) selector changing.
                          labels:
                            { app: checkout, tier: checkout, homeops-db-network: normal }
                          annotations:
                            homeops.isaacwallace.dev/restart-token: baseline
                        spec:
                          automountServiceAccountToken: false
                          securityContext: { seccompProfile: { type: RuntimeDefault } }
                          nodeSelector:
                            kubernetes.io/hostname: k3s-worker-apps
                          containers:
                            - name: checkout
                              image: ghcr.io/isaacwallace123/portfolio-checkout-demo:b9f89a3@sha256:c95b94387b53bb16e3d06bde699cb0783bed0a9944b151f5dc233156bfc9b19c
                              securityContext:
                                allowPrivilegeEscalation: false
                                runAsNonRoot: true
                                readOnlyRootFilesystem: true
                                capabilities: { drop: [ALL] }
                              env:
                                - { name: DATABASE_URL, value: "postgres://checkout:checkout@postgres:5432/checkout?sslmode=disable" }
                                - { name: REDIS_ADDR, value: "redis:6379" }
                                - { name: CACHE_ENABLED, value: "true" }
                                # Fixed CPU work per request. Capacity therefore scales with replica
                                # count (each replica has its own CPU limit), which is what makes the
                                # scale decision measurably lower p95. Tunable without a rebuild.
                                - { name: WORK_ITERATIONS, value: "3000" }
                                - { name: DB_MAX_CONNS, value: "8" }
                                - { name: RELEASE_TRACK, value: stable }
                                - { name: DATA_STATE, value: healthy }
                              ports: [{ containerPort: 8080 }]
                              # The app serves immediately and reports 503 until its pool is live, so
                              # poll fast: readiness then flips within ~a second of the DB coming up
                              # instead of waiting out a 5s window.
                              readinessProbe:
                                httpGet: { path: /healthz, port: 8080 }
                                initialDelaySeconds: 1
                                periodSeconds: 1
                                timeoutSeconds: 2
                                failureThreshold: 30
                              resources:
                                requests: { cpu: 50m, memory: 32Mi }
                                limits: { cpu: 250m, memory: 64Mi }
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-checkout" } }] }
              - { type: FromCompositeFieldPath, fromFieldPath: spec.apiReplicas, toFieldPath: spec.forProvider.manifest.spec.replicas }
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbMaxConns
                toFieldPath: "spec.forProvider.manifest.spec.template.spec.containers[0].env[4].value"
                transforms:
                  - { type: convert, convert: { toType: string } }
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.releaseTrack
                toFieldPath: "spec.forProvider.manifest.spec.template.spec.containers[0].env[5].value"
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dataState
                toFieldPath: "spec.forProvider.manifest.spec.template.spec.containers[0].env[6].value"
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.networkMode
                toFieldPath: "spec.forProvider.manifest.spec.template.metadata.labels[homeops-db-network]"
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.targetPool
                toFieldPath: "spec.forProvider.manifest.spec.template.spec.nodeSelector[kubernetes.io/hostname]"
                transforms:
                  - type: map
                    map:
                      apps: k3s-worker-apps
                      infra: k3s-worker-infra
                      unavailable: homeops-no-such-worker
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.restartToken
                toFieldPath: "spec.forProvider.manifest.spec.template.metadata.annotations[homeops.isaacwallace.dev/restart-token]"
                policy:
                  fromFieldPath: Required

          - name: checkout-service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
                    metadata: { name: checkout, namespace: "" }
                    spec:
                      selector: { app: checkout }
                      ports: [{ port: 80, targetPort: 8080 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-checkout-svc" } }] }

          # ── Canary tier — the candidate build, beside the stable one ──────
          # Same backend pool as checkout (label tier: checkout), so the gateway round-robins across
          # stable AND canary pods and the new build's share of traffic is simply its share of the
          # replicas. That is what a canary is, and it needs no routing rules to express.
          #
          # Zero replicas by default: a run that never touches the canary tier behaves exactly as it
          # did before this existed.
          - name: checkout-canary-deployment
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata:
                      { name: checkout-canary, namespace: "", labels: { app: checkout-canary } }
                    spec:
                      replicas: 0
                      selector: { matchLabels: { app: checkout-canary } }
                      template:
                        metadata:
                          # The database egress policy selects this label. Changing networkMode
                          # therefore changes a real NetworkPolicy edge, not an application flag.
                          labels:
                            {
                              app: checkout-canary,
                              tier: checkout,
                              homeops-db-network: normal,
                            }
                          annotations:
                            homeops.isaacwallace.dev/restart-token: baseline
                        spec:
                          automountServiceAccountToken: false
                          securityContext: { seccompProfile: { type: RuntimeDefault } }
                          nodeSelector:
                            kubernetes.io/hostname: k3s-worker-apps
                          containers:
                            - name: checkout
                              image: ghcr.io/isaacwallace123/portfolio-checkout-demo:b9f89a3@sha256:c95b94387b53bb16e3d06bde699cb0783bed0a9944b151f5dc233156bfc9b19c
                              securityContext:
                                allowPrivilegeEscalation: false
                                runAsNonRoot: true
                                readOnlyRootFilesystem: true
                                capabilities: { drop: [ALL] }
                              env:
                                - { name: DATABASE_URL, value: "postgres://checkout:checkout@postgres:5432/checkout?sslmode=disable" }
                                - { name: REDIS_ADDR, value: "redis:6379" }
                                - { name: CACHE_ENABLED, value: "true" }
                                - { name: WORK_ITERATIONS, value: "3000" }
                                - { name: DB_MAX_CONNS, value: "8" }
                                # Fixed: the canary tier IS the candidate build. Rolling the release
                                # track back does not make the canary stable — pulling it does.
                                - { name: RELEASE_TRACK, value: candidate }
                                - { name: DATA_STATE, value: healthy }
                              ports: [{ containerPort: 8080 }]
                              readinessProbe:
                                httpGet: { path: /healthz, port: 8080 }
                                initialDelaySeconds: 1
                                periodSeconds: 1
                                timeoutSeconds: 2
                                failureThreshold: 30
                              resources:
                                requests: { cpu: 50m, memory: 32Mi }
                                limits: { cpu: 250m, memory: 64Mi }
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-checkout-canary" } }] }
              - { type: FromCompositeFieldPath, fromFieldPath: spec.canaryReplicas, toFieldPath: spec.forProvider.manifest.spec.replicas }
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dbMaxConns
                toFieldPath: "spec.forProvider.manifest.spec.template.spec.containers[0].env[4].value"
                transforms:
                  - { type: convert, convert: { toType: string } }
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.dataState
                toFieldPath: "spec.forProvider.manifest.spec.template.spec.containers[0].env[6].value"
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.networkMode
                toFieldPath: "spec.forProvider.manifest.spec.template.metadata.labels[homeops-db-network]"
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.targetPool
                toFieldPath: "spec.forProvider.manifest.spec.template.spec.nodeSelector[kubernetes.io/hostname]"
                transforms:
                  - type: map
                    map:
                      apps: k3s-worker-apps
                      infra: k3s-worker-infra
                      unavailable: homeops-no-such-worker
                policy:
                  fromFieldPath: Required
              - type: FromCompositeFieldPath
                fromFieldPath: spec.restartToken
                toFieldPath: "spec.forProvider.manifest.spec.template.metadata.annotations[homeops.isaacwallace.dev/restart-token]"
                policy:
                  fromFieldPath: Required

          # ── Envoy gateway — the metrics source (admin :9901 exposes stats) ─
          # Headless service: DNS resolves to every backend pod IP so the gateway can load-balance
          # per request across replicas (see the envoy cluster config below). Selecting on `tier`
          # rather than `app` is what puts the stable and canary Deployments into one pool.
          - name: checkout-headless-service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
                    metadata: { name: checkout-headless, namespace: "" }
                    spec:
                      clusterIP: None
                      selector: { tier: checkout }
                      ports: [{ port: 8080, targetPort: 8080 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - {
                  type: FromCompositeFieldPath,
                  fromFieldPath: spec.runId,
                  toFieldPath: metadata.name,
                  transforms:
                    [
                      {
                        type: string,
                        string: { type: Format, fmt: "%s-checkout-headless" },
                      },
                    ],
                }

          - name: envoy-config
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata: { name: envoy-config, namespace: "" }
                    data:
                      envoy.yaml: |
                        # Flush stats every second so the latency histogram buckets update within the
                        # broker's short scrape window (otherwise the default 5s flush makes windowed
                        # p95 read zero between flushes).
                        stats_flush_interval: 1s
                        admin:
                          address:
                            socket_address: { address: 0.0.0.0, port_value: 9901 }
                        static_resources:
                          listeners:
                            - name: ingress
                              address:
                                socket_address: { address: 0.0.0.0, port_value: 8080 }
                              filter_chains:
                                - filters:
                                    - name: envoy.filters.network.http_connection_manager
                                      typed_config:
                                        "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                                        stat_prefix: ingress
                                        route_config:
                                          name: local
                                          virtual_hosts:
                                            - name: checkout
                                              domains: ["*"]
                                              routes:
                                                - match: { prefix: "/" }
                                                  route: { cluster: checkout, timeout: 5s }
                                        http_filters:
                                          - name: envoy.filters.http.router
                                            typed_config:
                                              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                          clusters:
                            - name: checkout
                              # STRICT_DNS against the HEADLESS service: DNS returns every checkout
                              # pod IP, so Envoy round-robins per request across all replicas. Against
                              # the ClusterIP service it would instead hold a few persistent
                              # connections that kube-proxy pins to one or two pods, leaving the rest
                              # idle — which would make scaling have no measurable effect.
                              type: STRICT_DNS
                              connect_timeout: 2s
                              dns_refresh_rate: 5s
                              lb_policy: ROUND_ROBIN
                              load_assignment:
                                cluster_name: checkout
                                endpoints:
                                  - lb_endpoints:
                                      - endpoint:
                                          address:
                                            socket_address:
                                              { address: checkout-headless, port_value: 8080 }
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-envoy-config" } }] }

          - name: envoy-deployment
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata: { name: envoy, namespace: "", labels: { app: envoy } }
                    spec:
                      # Overwritten from spec.gatewayReplicas on every reconcile. The gateway is a
                      # scalable tier because it is CPU-limited like everything else: one replica
                      # tops out near 2000 rps, so under the heaviest offered load it becomes the
                      # queue and no amount of checkout capacity behind it helps.
                      replicas: 1
                      selector: { matchLabels: { app: envoy } }
                      template:
                        metadata: { labels: { app: envoy } }
                        spec:
                          automountServiceAccountToken: false
                          securityContext: { seccompProfile: { type: RuntimeDefault } }
                          terminationGracePeriodSeconds: 3
                          containers:
                            - name: envoy
                              image: envoyproxy/envoy:distroless-v1.38.0@sha256:a7a56545102f7a682e0cafea2c9b8448af1b09ebb710eab688dfb931e3ec7ff6
                              args: ["-c", "/etc/envoy/envoy.yaml", "--service-cluster", "checkout"]
                              securityContext:
                                allowPrivilegeEscalation: false
                                runAsNonRoot: true
                                readOnlyRootFilesystem: true
                                capabilities: { drop: [ALL] }
                              ports: [{ containerPort: 8080 }, { containerPort: 9901 }]
                              # Without a probe, "Ready" means the container process started, which is
                              # a moment before Envoy has bound its listener — and the headless service
                              # publishes a ready pod immediately. A scale-out would therefore put an
                              # address into DNS that refuses connections for a beat, so the operator's
                              # correct move (widen the gateway) would spike the error rate it is being
                              # scored on. The admin server answers /ready once the listener is live.
                              readinessProbe:
                                httpGet: { path: /ready, port: 9901 }
                                initialDelaySeconds: 1
                                periodSeconds: 1
                                timeoutSeconds: 2
                                failureThreshold: 30
                              resources:
                                requests: { cpu: 50m, memory: 64Mi }
                                limits: { cpu: 300m, memory: 192Mi }
                              volumeMounts: [{ name: config, mountPath: /etc/envoy }]
                          volumes: [{ name: config, configMap: { name: envoy-config } }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-envoy" } }] }
              - { type: FromCompositeFieldPath, fromFieldPath: spec.gatewayReplicas, toFieldPath: spec.forProvider.manifest.spec.replicas }
              # the mounted ConfigMap is namespace-local, so its name stays "envoy-config"

          - name: envoy-service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
                    metadata: { name: envoy, namespace: "" }
                    spec:
                      selector: { app: envoy }
                      ports:
                        - { name: http, port: 80, targetPort: 8080 }
                        - { name: admin, port: 9901, targetPort: 9901 }
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-envoy-svc" } }] }

          # The generators dial the gateway through THIS service, not the ClusterIP one above, for the
          # same reason Envoy reaches checkout through a headless service: DNS returns every gateway
          # pod IP, so each new connection is dialled at a specific replica and the fan-out is
          # round-robin rather than whatever kube-proxy does with a single address.
          - name: envoy-headless-service
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Service
                    metadata: { name: envoy-headless, namespace: "" }
                    spec:
                      clusterIP: None
                      selector: { app: envoy }
                      ports: [{ name: http, port: 80, targetPort: 8080 }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-envoy-headless" } }] }

          # ── k6 — real load generator hitting Envoy ────────────────────────
          - name: k6-config
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: ConfigMap
                    metadata: { name: k6-script, namespace: "" }
                    data:
                      script.js: |
                        import http from 'k6/http';
                        import exec from 'k6/execution';
                        // Open-loop load: every generator OFFERS a fixed 400 requests per second no
                        // matter how fast the stack answers. The dial therefore means demand, and the
                        // gap between offered and served load is a real, scoreable signal.
                        //
                        // It used to be closed-loop (constant-vus: 150), where each user fired again
                        // only once the previous request returned. That makes throughput a measure of
                        // the SERVICE's capacity rather than of the load asked for, which inverts the
                        // number the arena shows: one generator against a healthy cached stack read
                        // ~2000/s while four against a saturated one read ~750/s. Adding load appeared
                        // to remove traffic, and no capacity-planning drill can be built on that.
                        //
                        // maxVUs is the bound that makes open-loop safe. Overload cannot spiral into
                        // unlimited concurrency: k6 runs out of VUs, drops the iterations it cannot
                        // start, and served load visibly falls short of offered — which is exactly the
                        // "you are under-provisioned" signal. Add capacity and it recovers on the next
                        // arrival, because the arrival rate never changed.
                        export const options = {
                          discardResponseBodies: true,
                          // Re-resolve the gateway constantly and take a different pod IP each time a
                          // connection is dialled. A one-second TTL is what makes a gateway scale-out
                          // visible to the generator at all: the default is five minutes, so a replica
                          // added mid-run would not be in this VU's rotation before the run expired.
                          dns: { ttl: '1s', select: 'roundRobin', policy: 'preferIPv4' },
                          scenarios: {
                            load: {
                              executor: 'constant-arrival-rate',
                              rate: 400,
                              timeUnit: '1s',
                              duration: '12h',
                              preAllocatedVUs: 50,
                              maxVUs: 200,
                              gracefulStop: '0s',
                            },
                          },
                        };
                        // How many iterations a VU keeps a connection before throwing it away.
                        //
                        // Without this, scaling the gateway measurably did NOTHING. HTTP keep-alive
                        // pins each VU to the pod it first connected to, and neither DNS nor kube-proxy
                        // can move an established connection — so replicas two and three came up, sat
                        // at idle CPU, and every request stayed queued at the original pod. On screen
                        // that is one hot Envoy card beside two cold ones, and it made the gateway
                        // drills' correct answer a no-op: the arena said "widen the front door" and
                        // widening it changed no measured signal.
                        //
                        // Recycling a slice of the pool continuously fixes it without pretending
                        // browsers reconnect per request: connections are still reused ten times over,
                        // a scale-out is absorbed within a second or two, and the cost is a few dozen
                        // extra handshakes a second per generator instead of four hundred.
                        const RECYCLE_EVERY = 10;
                        // Envoy honours `Connection: close` and hangs up after answering, so the next
                        // iteration dials again — and dialling again is what consults DNS.
                        const RECYCLE = { headers: { Connection: 'close' } };
                        export default function () {
                          const iteration = exec.vu.iterationInInstance;
                          http.get(
                            'http://envoy-headless/',
                            iteration % RECYCLE_EVERY === 0 ? RECYCLE : undefined);
                        }
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-k6-script" } }] }

          - name: k6-deployment
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                providerConfigRef: { name: homeops }
                forProvider:
                  manifest:
                    apiVersion: apps/v1
                    kind: Deployment
                    metadata: { name: k6, namespace: "", labels: { app: k6 } }
                    spec:
                      replicas: 1
                      selector: { matchLabels: { app: k6 } }
                      template:
                        metadata: { labels: { app: k6 } }
                        spec:
                          automountServiceAccountToken: false
                          securityContext: { seccompProfile: { type: RuntimeDefault } }
                          terminationGracePeriodSeconds: 3
                          containers:
                            - name: k6
                              image: grafana/k6:master@sha256:2f8f626bb998d8d73c22d741278e48dd591208f07926960935c7eaf63691fd8b
                              args: ["run", "--quiet", "/scripts/script.js"]
                              securityContext:
                                allowPrivilegeEscalation: false
                                runAsNonRoot: true
                                capabilities: { drop: [ALL] }
                              # 768Mi because the open-loop script may hold up to 200 VUs when the
                              # stack is slow; at 512Mi a saturated run OOM-killed the generator,
                              # which reads on screen as the incident fixing itself.
                              resources:
                                requests: { cpu: 100m, memory: 192Mi }
                                limits: { cpu: 800m, memory: 768Mi }
                              volumeMounts: [{ name: script, mountPath: /scripts }]
                          volumes: [{ name: script, configMap: { name: k6-script } }]
            patches:
              - type: PatchSet
                patchSetName: namespaced
              - { type: FromCompositeFieldPath, fromFieldPath: spec.runId, toFieldPath: metadata.name, transforms: [{ type: string, string: { type: Format, fmt: "%s-k6" } }] }
              - { type: FromCompositeFieldPath, fromFieldPath: spec.loadReplicas, toFieldPath: spec.forProvider.manifest.spec.replicas }
