# Identity for the HomeOps run-broker (the service behind homelab.isaacwallace.dev/api/v1).
#
# The broker's only cluster privilege is to CRUD LabRun composites and read their status. LabRun is
# cluster-scoped (Crossplane v2, scope: Cluster), so this is a ClusterRole. The broker cannot touch
# the disposable namespaces directly, personal namespaces, secrets, or any other resource — all
# provisioning and teardown is mediated by Crossplane through the LabRun. The broker itself is not
# deployed yet; this identity is ready for it (Delivery slice 5).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homeops-broker
  namespace: homeops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homeops-broker
rules:
  # patch/update are required for operator decisions (the broker patches spec fields like apiReplicas).
  - apiGroups: ["platform.homelab.isaacwallace.dev"]
    resources: ["labruns"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["platform.homelab.isaacwallace.dev"]
    resources: ["labruns/status"]
    verbs: ["get"]
  # Read-only resource usage (CPU/memory) for run telemetry. metrics.k8s.io exposes only usage
  # numbers — no pod specs, env, or secrets — so this stays low-sensitivity.
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  # Read Kubernetes Events in run namespaces for the arena's real event stream.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  # Read-only pod and deployment state for the request-path flowchart (readiness, restarts, and the
  # per-pod CPU/memory each tier is using). The broker never writes to workloads directly.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  # Write-through on the composed Object, for replica counts only. Crossplane v2's realtime circuit
  # breaker trips constantly under the composed resources' own status churn, so a LabRun spec change
  # can sit for up to a minute before it reaches the Deployment. The broker therefore also writes the
  # replica count the LabRun already carries straight to the composed Object, which provider-kubernetes
  # applies in ~200ms. The LabRun stays the source of truth: Crossplane's later reconcile writes the
  # identical value, so the two never diverge and the workload never flaps back.
  - apiGroups: ["kubernetes.crossplane.io"]
    resources: ["objects"]
    verbs: ["get", "patch"]
  # Sanitized platform status: ready-node counts only. The API never returns node names or labels.
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  # The public inventory selects a hard-coded allowlist from these read-only collections and returns
  # only readiness and aggregate metrics. It never exposes raw specs, names, labels, or addresses.
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homeops-broker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homeops-broker
subjects:
  # In-homeops identity (reserved for a future in-namespace broker).
  - kind: ServiceAccount
    name: homeops-broker
    namespace: homeops
  # The api.isaacwallace.dev pod (portfolio namespace) IS the broker today — its ServiceAccount runs
  # the run-broker in-cluster, scoped to LabRun CRUD + metrics read only.
  - kind: ServiceAccount
    name: homeops-broker
    namespace: portfolio
