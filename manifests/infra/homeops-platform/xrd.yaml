# LabRun — the HomeOps platform API (Crossplane v2 model).
#
# The run-broker for homelab.isaacwallace.dev creates one `LabRun` composite per admitted drill;
# Crossplane composes it into an isolated, disposable namespace (see composition.yaml). Crossplane v2
# drops the separate claim, so the broker creates the composite directly. It is `scope: Cluster`
# because it composes a cluster-scoped Namespace (a Namespaced composite may only compose resources in
# its own namespace). The public contract stays independent of Kubernetes — a LabRun carries only an
# allowlisted scenario id, the broker-issued run id, a resource class, and a TTL. Images, commands,
# and manifests are never caller supplied; they live in the Composition, in this repository.
apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: labruns.platform.homelab.isaacwallace.dev
spec:
  scope: Cluster
  group: platform.homelab.isaacwallace.dev
  names:
    kind: LabRun
    plural: labruns
  defaultCompositionRef:
    name: checkout-traffic-spike
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                scenarioId:
                  type: string
                  description: Allowlisted scenario identifier (e.g. checkout-traffic-spike).
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  maxLength: 63
                runId:
                  type: string
                  description: Broker-issued run id; becomes the disposable namespace name.
                  pattern: "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  maxLength: 63
                resourceClass:
                  type: string
                  enum: ["light", "standard", "heavy"]
                  default: standard
                apiReplicas:
                  type: integer
                  description: Checkout API replica count. The broker patches this for the "scale"
                    operator decision; defaults to the baseline.
                  default: 3
                  minimum: 1
                  maximum: 6
                cacheReplicas:
                  type: integer
                  description: Redis cache tier size (0 or 1). The broker sets 1 for the "cache"
                    operator decision. The demo checkout app does not route through it yet — a real
                    app would; this provisions the tier.
                  default: 0
                  minimum: 0
                  maximum: 1
                releaseTrack:
                  type: string
                  description: Broker-selected checkout release. Candidate is intentionally
                    regressed; the rollback decision changes this to stable.
                  enum: ["stable", "candidate"]
                  default: stable
                dataState:
                  type: string
                  description: Broker-selected disposable catalogue condition for the recovery drill.
                  enum: ["healthy", "degraded", "recovered"]
                  default: healthy
                targetPool:
                  type: string
                  description: Allowlisted worker pool for scenario-owned checkout replicas.
                  enum: ["apps", "infra"]
                  default: apps
                loadReplicas:
                  type: integer
                  description: >-
                    Bounded k6 load generator count. Each generator runs the same closed-loop script,
                    so this is the load-intensity dial — zero is quiet, four saturates the checkout
                    tier. Scenario runs start with one.
                  default: 1
                  minimum: 0
                  maximum: 4
                restartToken:
                  type: string
                  description: Broker-issued rollout token. Changing it restarts only the
                    scenario-owned checkout Deployment.
                  default: baseline
                  maxLength: 64
                owner:
                  description: Opaque per-user key (a hash of the signed-in account id, never the id
                    itself) identifying who provisioned this cluster. The broker refuses to read or
                    mutate a cluster whose owner does not match the caller, and caps how many
                    clusters one owner may hold.
                  type: string
                  pattern: "^$|^[a-f0-9]{16,64}$"
                  default: ""
                  maxLength: 64
                drillId:
                  type: string
                  description: Allowlisted drill currently running ON this cluster, or empty when the
                    cluster is an open sandbox. A drill layers an objective, a clock, and a decision
                    set over the same live workload — it does not reprovision the namespace.
                  pattern: "^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?$"
                  default: ""
                  maxLength: 63
                drillStartedAt:
                  type: string
                  description: RFC3339 time the active drill began, so its clock is independent of
                    when the cluster itself was provisioned.
                  default: ""
                  maxLength: 40
                ttlSeconds:
                  type: integer
                  description: Hard time-to-live. Teardown is broker-owned; the broker deletes the
                    claim by this deadline and Crossplane garbage-collects the namespace.
                  default: 900
                  minimum: 60
                  maximum: 3600
              required:
                - scenarioId
                - runId
            status:
              type: object
              properties:
                namespace:
                  type: string
                  description: The disposable namespace composed for this run.
      additionalPrinterColumns:
        - name: Scenario
          type: string
          jsonPath: .spec.scenarioId
        - name: Namespace
          type: string
          jsonPath: .status.namespace
