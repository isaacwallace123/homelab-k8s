# =============================================================================
# THE GAME FLEET.
#
# Adding a server is an entry here. Everything else — namespace, quota, isolation policy,
# world volume, exclusive CPU cores, LoadBalancer address, backup schedule — is composed
# from it.
#
# MEMORY BUDGET. The game node has 56 GB. These sizes total more than that on purpose:
#
#   small   2 CPU /  4Gi        large   6 CPU / 12Gi
#   medium  4 CPU /  8Gi        xl      8 CPU / 16Gi
#
# All six running at once would be ~64 GB, which does not fit. That is fine and intended:
# the `games` namespace quota refuses to schedule the server that would overcommit, and
# idle.shutdownAfter means a defined server costs nothing while nobody is playing. With
# six declared and two in use, the fleet costs the two. See
# docs/architecture/game-platform.md §6.
#
# Roll these out ONE AT A TIME (migration phase 5). Start with `vanilla` — it is the
# cheapest way to prove the whole chain works before committing a 100 GB modpack to it.
# =============================================================================

servers:

  # ── the canary ──────────────────────────────────────────────────────────────
  # Deliberately tiny. Deploy this first: it validates namespace, quota, PVC, StatefulSet,
  # LoadBalancer address, and backup CronJob in about two minutes.
  vanilla:
    game: minecraft
    displayName: "Vanilla SMP"
    size: small
    storage:
      size: 20Gi
      class: nvme-local
    network:
      publish: mc-router
      hostnames: [smp.mc.isaacwallace.dev]
    minecraft:
      type: PAPER
      version: "LATEST"
      difficulty: normal
      maxPlayers: 20
    idle:
      shutdownAfter: 30m

  # ── All The Mods 10 ─────────────────────────────────────────────────────────
  # xl because ATM10 wants 10-14 GB of heap and is the single most tick-sensitive thing
  # here. Needs a CurseForge API key in the cf-api-key secret before it will resolve.
  atm10:
    enabled: false # flip on once vanilla has proven the chain
    game: minecraft
    displayName: "All The Mods 10"
    size: xl
    storage:
      size: 100Gi
      class: nvme-local
    network:
      publish: mc-router
      hostnames: [atm10.mc.isaacwallace.dev]
    minecraft:
      type: AUTO_CURSEFORGE
      modpack: "all-the-mods-10"
      difficulty: normal
      maxPlayers: 10
    backup:
      schedule: "0 5 * * *"
      retention: 14
    idle:
      shutdownAfter: 45m

  # ── Satisfactory ────────────────────────────────────────────────────────────
  # Memory hungry rather than tick sensitive. Its own LoadBalancer address: UDP 7777 has
  # no hostname multiplexing equivalent to mc-router.
  satisfactory:
    enabled: false
    game: satisfactory
    displayName: "Satisfactory"
    size: large
    storage:
      size: 50Gi
      class: nvme-local
    network:
      publish: loadbalancer
    idle:
      shutdownAfter: 60m

  # ── tModLoader ──────────────────────────────────────────────────────────────
  terraria:
    enabled: false
    game: terraria
    displayName: "Modded Terraria"
    size: small
    storage:
      size: 10Gi
    network:
      publish: loadbalancer
    idle:
      shutdownAfter: 30m

  # ── Rust ────────────────────────────────────────────────────────────────────
  # The most expensive thing in the fleet. Run it alone, or accept that nothing else fits
  # alongside it.
  rust:
    enabled: false
    game: rust
    displayName: "Rust"
    size: xl
    storage:
      size: 60Gi
    network:
      publish: loadbalancer
    steam:
      extraEnv:
        RUST_SERVER_NAME: "Isaac's Rust Server"
        RUST_SERVER_WORLDSIZE: "3500"
    backup:
      schedule: "0 6 * * *"
      retention: 7

  # ── Garry's Mod ─────────────────────────────────────────────────────────────
  gmod:
    enabled: false
    game: gmod
    displayName: "Garry's Mod"
    size: medium
    storage:
      size: 30Gi
    network:
      publish: loadbalancer
    idle:
      shutdownAfter: 30m

  # s&box is not here on purpose. Its dedicated server tooling is still moving and is not
  # settled the way the others are; it gets a catalogue entry once it has actually been
  # tested rather than assumed. See docs/architecture/game-platform.md §8.
