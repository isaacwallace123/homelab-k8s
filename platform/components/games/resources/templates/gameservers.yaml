{{/*
The fleet. Each entry in .Values.servers becomes one GameServer.

Composition selection is done here rather than by the person declaring a server. Crossplane
matches Compositions against XR *labels*, not spec fields, so something has to translate
`game: satisfactory` into "use the container Composition". Doing it in this template keeps
the user-facing API to just `game:` — which is the whole point of having a platform API.
*/}}
{{- $familyOf := dict
      "minecraft"    "minecraft"
      "satisfactory" "container"
      "terraria"     "container"
      "rust"         "container"
      "gmod"         "container"
      "linuxgsm"     "container" }}

{{- range $name, $server := .Values.servers }}
{{- $enabled := true }}
{{- if hasKey $server "enabled" }}{{ $enabled = $server.enabled }}{{ end }}
{{- if $enabled }}
{{- $family := index $familyOf $server.game }}
{{- if not $family }}
  {{- fail (printf "server %q declares unknown game %q (known: %s)" $name $server.game (keys $familyOf | sortAlpha | join ", ")) }}
{{- end }}
---
apiVersion: platform.homelab.isaacwallace.dev/v1alpha1
kind: GameServer
metadata:
  name: {{ $name }}
  labels:
    homelab.isaacwallace.dev/game: {{ $server.game }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  crossplane:
    compositionSelector:
      matchLabels:
        platform.homelab.isaacwallace.dev/family: {{ $family }}
  {{- omit $server "enabled" | toYaml | nindent 2 }}
{{- end }}
{{- end }}
