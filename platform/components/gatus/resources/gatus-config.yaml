# Gatus configuration: what status.blockoutgames.com checks and who it tells.
#
# Every endpoint runs once a minute from k8s-apps-01 on pve2. Public endpoints are checked
# through Cloudflare, the same way a visitor reaches them, so a tunnel or DNS outage counts.
# Endpoints with `enabled: false` are not checked and not shown; each says what flips it.
#
# Alerts go to ntfy topic `blockout-status` after 3 failures in a row and resolve after 2
# successes. The status page itself is public: anything internal hides its URL, host and port.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: status
data:
  config.yaml: |
    storage:
      type: sqlite
      path: /data/data.db

    # Branded to match blockoutgames.com (the studio theme in the Platform repo's
    # packages/ui/src/styles/studio-theme.css, as HSL for Gatus' shadcn variables). The www
    # site's own /status page replaces this page later; Gatus then serves only its JSON.
    ui:
      title: Status · Blockout Games
      header: Blockout Games
      dashboard-heading: Status
      dashboard-subheading: Every Blockout Games service, checked every minute from a separate server.
      description: Is Blockout Games up? Every service, checked every minute.
      logo: https://www.blockoutgames.com/icon
      favicon:
        default: https://www.blockoutgames.com/icon
      link: https://blockoutgames.com
      dark-mode: true
      buttons:
        - name: Website
          link: https://blockoutgames.com
        - name: Docs
          link: https://docs.blockoutgames.com
      custom-css: |
        @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap');
        :root {
          --background: 0.0 0.0% 98.0%;
          --foreground: 0.0 0.0% 9.0%;
          --card: 0.0 0.0% 100.0%;
          --card-foreground: 0.0 0.0% 9.0%;
          --popover: 0.0 0.0% 100.0%;
          --popover-foreground: 0.0 0.0% 9.0%;
          --primary: 20.5 90.2% 48.2%;
          --primary-foreground: 0.0 0.0% 100.0%;
          --secondary: 0.0 0.0% 94.1%;
          --secondary-foreground: 0.0 0.0% 9.0%;
          --muted: 0.0 0.0% 94.1%;
          --muted-foreground: 0.0 0.0% 32.2%;
          --accent: 0.0 0.0% 94.1%;
          --accent-foreground: 0.0 0.0% 9.0%;
          --destructive: 0.0 73.7% 41.8%;
          --destructive-foreground: 0.0 0.0% 100.0%;
          --border: 0.0 0.0% 89.8%;
          --input: 0.0 0.0% 83.1%;
          --ring: 20.5 90.2% 48.2%;
          --radius: 0.75rem;
        }
        :root.dark {
          --background: 0.0 0.0% 3.9%;
          --foreground: 0.0 0.0% 98.0%;
          --card: 0.0 0.0% 7.8%;
          --card-foreground: 0.0 0.0% 98.0%;
          --popover: 0.0 0.0% 11.0%;
          --popover-foreground: 0.0 0.0% 98.0%;
          --primary: 24.6 95.0% 53.1%;
          --primary-foreground: 0.0 0.0% 6.7%;
          --secondary: 0.0 0.0% 11.0%;
          --secondary-foreground: 0.0 0.0% 98.0%;
          --muted: 0.0 0.0% 11.0%;
          --muted-foreground: 0.0 0.0% 63.9%;
          --accent: 0.0 0.0% 11.0%;
          --accent-foreground: 0.0 0.0% 98.0%;
          --destructive: 358.1 75.1% 59.0%;
          --destructive-foreground: 0.0 0.0% 98.0%;
          --border: 0.0 0.0% 14.9%;
          --input: 0.0 0.0% 18.0%;
          --ring: 27.0 96.0% 61.0%;
          --radius: 0.75rem;
        }
        body, button, input, select { font-family: 'Geist', ui-sans-serif, system-ui, sans-serif !important; letter-spacing: -0.01em; }
        :root.dark body { background: radial-gradient(1200px 600px at 50% -10%, rgba(249,115,22,0.10), transparent 60%), hsl(var(--background)); }
        h1, h2 { letter-spacing: -0.03em; }
        /* Cards: hairline borders and soft depth, as on blockoutgames.com */
        .rounded-lg, .rounded-xl { border-radius: var(--radius) !important; }
        :root.dark .border { border-color: hsl(var(--border)) !important; }
        :root.dark .bg-card, :root.dark .rounded-lg.border { box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 1px 2px rgba(0,0,0,0.4); }
        /* Status colours: our green and red, the orange only for the brand */
        .bg-green-500, .bg-green-600 { background-color: #22c55e !important; }
        .bg-red-500, .bg-red-600 { background-color: #ef4444 !important; }
        a:hover { color: hsl(var(--ring)); }

    alerting:
      # ntfy here has no auth (networking/ntfy-config sets none), so there is no token to seal.
      ntfy:
        url: http://ntfy.networking.svc.cluster.local
        topic: blockout-status
        priority: 4
        default-alert:
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true

    endpoints:
      # ── Website ─────────────────────────────────────────────────────────────────────────
      - name: Home page
        group: Website
        url: https://blockoutgames.com/
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: ntfy

      - name: www health
        group: Website
        url: https://www.blockoutgames.com/healthz
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].ok == true"
        alerts:
          - type: ntfy

      # ── Panel ───────────────────────────────────────────────────────────────────────────
      - name: Studio panel
        group: Panel
        url: https://studio.blockoutgames.com/healthz
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: ntfy

      # ── Developer API ───────────────────────────────────────────────────────────────────
      # 401 without a key proves the route reaches the API and the key check answers.
      - name: Developer API
        group: Developer API
        url: https://studio.blockoutgames.com/developer/v1/key
        interval: 60s
        conditions:
          - "[STATUS] == 401"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: ntfy

      # ── Docs ────────────────────────────────────────────────────────────────────────────
      # Off until docs.blockoutgames.com ships (it 404s today). Switch on in the launch commit.
      - name: Docs
        group: Docs
        enabled: false
        url: https://docs.blockoutgames.com/
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 5000"
        alerts:
          - type: ntfy

      # ── Platform features ───────────────────────────────────────────────────────────────
      # Read from the platform's public status JSON, which does not exist yet: the Platform
      # PR that adds GET /api/status on www has not been opened (2026-10-26). Turn these on
      # once https://blockoutgames.com/api/status answers. The public URL, not
      # www.blockout.svc:3001, because Blockout's default-deny admits only the edge gateway
      # to www.
      - name: Collector
        group: Platform
        enabled: false
        url: https://blockoutgames.com/api/status
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].collector.state == ok"
        alerts:
          - type: ntfy

      - name: Game snapshots
        group: Platform
        enabled: false
        url: https://blockoutgames.com/api/status
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].jobs.snapshot.fresh == true"
        alerts:
          - type: ntfy

      - name: GitHub sync
        group: Platform
        enabled: false
        url: https://blockoutgames.com/api/status
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].jobs.github.fresh == true"
        alerts:
          - type: ntfy

      - name: Assistant
        group: Platform
        enabled: false
        url: https://blockoutgames.com/api/status
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].assistant.connected == true"
        alerts:
          - type: ntfy

      - name: Push notifications
        group: Platform
        enabled: false
        url: https://blockoutgames.com/api/status
        interval: 60s
        conditions:
          - "[STATUS] == 200"
          - "[BODY].push.ok == true"
        alerts:
          - type: ntfy

      # ── Internals ───────────────────────────────────────────────────────────────────────
      # Off until the Platform repo admits namespace `status` to api:4000; today its
      # api-from-web-apps NetworkPolicy lets in panel, www and ai only.
      - name: API readiness
        group: Internals
        enabled: false
        url: http://api.blockout.svc.cluster.local:4000/readyz
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        ui:
          hide-url: true
          hide-hostname: true
          hide-port: true
        alerts:
          - type: ntfy

      # On since 2026-10-27: UFW on ai-core-01 admits k8s-apps-01 (192.168.0.18) on port 4000
      # (recorded in the ailab repo's ailab_litellm_allowed_cidrs). Whether the assistant answers
      # end to end is the Platform's status JSON's job (the "Platform" group).
      # The model server (ai-node-01:18090) is not checked at all: its UFW admits ai-core-01
      # only, and it has no auth, so it should stay that way.
      - name: Assistant gateway
        group: AI
        url: http://192.168.0.221:4000/health/liveliness
        interval: 60s
        conditions:
          - "[STATUS] == 200"
        ui:
          hide-url: true
          hide-hostname: true
          hide-port: true
        alerts:
          - type: ntfy
