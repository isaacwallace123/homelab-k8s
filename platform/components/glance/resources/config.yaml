# The homelab dashboard — Glance (https://github.com/glanceapp/glance).
#
# Replaced gethomepage/homepage, which is gone from the cluster and from this repo. Glance
# owns 192.168.0.220 outright now — component, Deployment, Service, ConfigMaps and Secret all
# carry the `glance` name.
#
# Layout lives in four files so each page reads on its own:
#   glance.yml   server, theme, branding, and the page list
#   home.yml     cluster at a glance — status, services, streams, downloads
#   media.yml    the *arr side — queue, upcoming releases, requests, health
#   cluster.yml  the infrastructure view — nodes, Longhorn, certs, busiest pods
#
# Every widget fetches server-side from cluster DNS and is cached for its `cache` window, so
# a page load is served from memory instead of fanning out to a dozen APIs per visitor.
#
# ${VARS} are read from the environment, which is the whole of the glance-secrets Secret
# (envFrom) — its keys are used as-is: PLEX_TOKEN, RADARR_KEY, SONARR_KEY, PROWLARR_KEY,
# OVERSEERR_KEY, SAB_KEY, QB_PASS, GRAFANA_PASS.
#
# Glance watches its config and reloads on change, but a ConfigMap update takes up to a
# minute to reach the volume. If a change does not show after that:
#   kubectl -n networking rollout restart deploy/glance
apiVersion: v1
kind: ConfigMap
metadata:
  name: glance-config
  namespace: networking
data:
  glance.yml: |
    server:
      port: 8080
      assets-path: /app/assets

    document:
      # Glance renders once per page load and has no live refresh. On the iPad, as a
      # home-screen app, there is no pull-to-refresh either — so reload when the app is
      # brought back after a minute away, and every two minutes while it sits open. Never
      # while the search box has focus.
      head: |
        <script>
          (() => {
            let loadedAt = Date.now();
            const typing = () => document.activeElement && document.activeElement.matches("input, textarea");
            const stale = (ms) => Date.now() - loadedAt > ms;
            const refresh = () => { if (!typing()) location.reload(); };
            document.addEventListener("visibilitychange", () => {
              if (document.visibilityState === "visible" && stale(60000)) refresh();
            });
            setInterval(() => {
              if (document.visibilityState === "visible" && stale(120000)) refresh();
            }, 15000);
          })();
        </script>

    theme:
      # Monochrome. Cool near-black, near-white for anything that leads, and colour reserved
      # for state — green means up, red means broken. Nothing is tinted for decoration, which
      # is what keeps a wall of twenty service tiles readable at a glance.
      background-color: 222 12 7
      primary-color: 216 28 84
      positive-color: 152 44 54
      negative-color: 358 62 60
      contrast-multiplier: 1.3
      text-saturation-multiplier: 0.8
      custom-css-file: /assets/homelab.css
      presets:
        # Same design in light. The picker is top-right; the choice sticks per device, so the
        # iPad can sit on light while everything else stays dark.
        daylight:
          light: true
          background-color: 220 16 97
          primary-color: 220 22 26
          positive-color: 152 48 30
          negative-color: 358 58 45
          contrast-multiplier: 1.2
          text-saturation-multiplier: 0.8

    branding:
      # Added to the iPad home screen, this is what the app is called and what its icon is.
      app-name: Homelab
      app-icon-url: /assets/icon.png
      favicon-url: /assets/icon.png
      app-background-color: "#0f1113"
      logo-text: H
      hide-footer: true

    pages:
      - $include: home.yml
      - $include: media.yml
      - $include: cluster.yml

  home.yml: |
    - name: Home
      slug: home
      columns:
        # ── left: the cluster itself ──────────────────────────────────────────────────────
        - size: small
          widgets:
            - type: clock
              hour-format: 12h
              hide-header: true

            # open-meteo, no key and no account. An unresolvable location is a startup
            # error rather than a broken widget, so this name is one Glance can geocode.
            - type: weather
              location: Candiac, Quebec, Canada
              units: metric
              hour-format: 12h
              hide-header: true

            - type: calendar
              first-day-of-week: sunday
              hide-header: true

            - type: custom-api
              title: Cluster
              title-url: http://192.168.0.240
              cache: 30s
              subrequests:
                cpu:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: '100 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100'
                mem:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: '(1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)) * 100'
                disk:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'max(1 - node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100'
                nodes:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'count(up{job="node-exporter"} == 1) or vector(0)'
                nodesTotal:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'count(up{job="node-exporter"}) or vector(0)'
                rx:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'sum(rate(node_network_receive_bytes_total{device!~"lo|cni.*|veth.*|tun.*|flannel.*"}[5m]))'
                tx:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'sum(rate(node_network_transmit_bytes_total{device!~"lo|cni.*|veth.*|tun.*|flannel.*"}[5m]))'
              template: |
                {{ define "rate" }}{{ if ge . 1048576.0 }}{{ printf "%.1f" (div . 1048576.0) }}<small>MB/s</small>{{ else }}{{ printf "%.0f" (div . 1024.0) }}<small>KB/s</small>{{ end }}{{ end }}
                {{ $cpu := (.Subrequest "cpu").JSON.Float "data.result.0.value.1" }}
                {{ $mem := (.Subrequest "mem").JSON.Float "data.result.0.value.1" }}
                {{ $disk := (.Subrequest "disk").JSON.Float "data.result.0.value.1" }}
                {{ $up := (.Subrequest "nodes").JSON.Int "data.result.0.value.1" }}
                {{ $total := (.Subrequest "nodesTotal").JSON.Int "data.result.0.value.1" }}
                {{ if ne (.Subrequest "cpu").Response.StatusCode 200 }}
                <div class="hl-fail">Prometheus answered {{ (.Subrequest "cpu").Response.Status }}</div>
                {{ else }}
                <div class="hl-stats">
                  <div>
                    <div class="hl-label">CPU</div>
                    <div class="hl-value">{{ printf "%.0f" $cpu }}<small>%</small></div>
                    <div class="hl-bar{{ if ge $cpu 85.0 }} hl-hot{{ end }}"><span style="--p: {{ printf "%.0f" $cpu }}"></span></div>
                  </div>
                  <div>
                    <div class="hl-label">Memory</div>
                    <div class="hl-value">{{ printf "%.0f" $mem }}<small>%</small></div>
                    <div class="hl-bar{{ if ge $mem 85.0 }} hl-hot{{ end }}"><span style="--p: {{ printf "%.0f" $mem }}"></span></div>
                  </div>
                  <div>
                    <div class="hl-label">Root disk</div>
                    <div class="hl-value">{{ printf "%.0f" $disk }}<small>%</small></div>
                    <div class="hl-bar{{ if ge $disk 85.0 }} hl-hot{{ end }}"><span style="--p: {{ printf "%.0f" $disk }}"></span></div>
                  </div>
                  <div>
                    <div class="hl-label">Nodes</div>
                    <div class="hl-value{{ if lt $up $total }} color-negative{{ end }}">{{ $up }}<small>/ {{ $total }}</small></div>
                    <div class="hl-sub">{{ if lt $up $total }}{{ sub $total $up }} down{{ else }}all ready{{ end }}</div>
                  </div>
                  <div>
                    <div class="hl-label">Net in</div>
                    <div class="hl-value">{{ template "rate" ((.Subrequest "rx").JSON.Float "data.result.0.value.1") }}</div>
                  </div>
                  <div>
                    <div class="hl-label">Net out</div>
                    <div class="hl-value">{{ template "rate" ((.Subrequest "tx").JSON.Float "data.result.0.value.1") }}</div>
                  </div>
                </div>
                {{ end }}

            - type: custom-api
              title: Alerts
              title-url: http://192.168.0.242
              cache: 1m
              url: http://alertmanager.monitoring.svc.cluster.local:9093/api/v2/alerts
              parameters:
                active: "true"
                silenced: "false"
                inhibited: "false"
              template: |
                {{ $alerts := .JSON.Array "" }}
                {{ if ne .Response.StatusCode 200 }}
                  <div class="hl-fail">Alertmanager answered {{ .Response.Status }}</div>
                {{ else if eq (len $alerts) 0 }}
                  <div class="hl-allclear"><span class="hl-dot"></span>All clear</div>
                {{ else }}
                  <ul class="list list-gap-14">
                  {{ range $alerts }}
                    <li class="flex gap-10 items-start">
                      <span class="hl-dot {{ if eq (.String "labels.severity") "critical" }}hl-bad{{ else }}hl-warn{{ end }}"></span>
                      <div class="min-width-0">
                        <div class="color-highlight text-truncate">{{ .String "labels.alertname" }}</div>
                        <div class="size-h6 color-paragraph text-truncate-2-lines">{{ if .Exists "annotations.summary" }}{{ .String "annotations.summary" }}{{ else }}{{ .String "labels.namespace" }}{{ end }}</div>
                        <div class="size-h6 color-subdue" {{ parseRelativeTime "rfc3339" (.String "startsAt") }}></div>
                      </div>
                    </li>
                  {{ end }}
                  </ul>
                {{ end }}

        # ── centre: every service, with a live up/down check ─────────────────────────────
        - size: full
          widgets:
            - type: search
              search-engine: google
              new-tab: true
              hide-header: true
              placeholder: Search the web…

            # `url` is the LAN address the tile opens. `check-url` only where the page a person
            # opens is not a meaningful health signal.
            - type: monitor
              title: Media
              cache: 1m
              sites:
                - title: Plex
                  url: http://192.168.0.230:32400/web
                  check-url: http://plex.media.svc.cluster.local:32400/identity
                  icon: di:plex
                - title: Overseerr
                  url: http://192.168.0.236
                  icon: di:overseerr
                - title: Radarr
                  url: http://192.168.0.231
                  icon: di:radarr
                - title: Sonarr
                  url: http://192.168.0.232
                  icon: di:sonarr
                - title: Prowlarr
                  url: http://192.168.0.233
                  icon: di:prowlarr
                - title: qBittorrent
                  url: http://192.168.0.234
                  icon: di:qbittorrent
                # SABnzbd's host_whitelist only admits sabnzbd.lan, so a request by IP is
                # answered 403 by a healthy server. The API with a key is the real check.
                - title: SABnzbd
                  url: http://192.168.0.235
                  check-url: http://sabnzbd.media.svc.cluster.local:8090/api?mode=version&output=json
                  icon: di:sabnzbd

            - type: monitor
              title: Cloud & Fitness
              cache: 1m
              sites:
                - title: Immich
                  url: http://192.168.0.244
                  check-url: http://immich.cloud.svc.cluster.local/api/server/ping
                  icon: di:immich
                - title: Stirling PDF
                  url: http://192.168.0.247
                  icon: di:stirling-pdf
                - title: openGym
                  url: http://192.168.0.246
                  icon: mdi:dumbbell
                # Garage has no web UI — .245 is the raw S3 API, which refuses anonymous requests,
                # so opening the tile shows AccessDenied from a healthy server. The status comes
                # from the admin API's /health, which is the signal that actually means something.
                - title: Garage S3
                  url: http://192.168.0.245
                  check-url: http://garage.cloud.svc.cluster.local:3903/health
                  icon: di:garage

            - type: split-column
              max-columns: 2
              widgets:
                - type: monitor
                  title: Observability
                  cache: 1m
                  style: compact
                  sites:
                    - title: Grafana
                      url: http://192.168.0.240
                      check-url: http://grafana.monitoring.svc.cluster.local:3000/api/health
                      icon: di:grafana
                    - title: Prometheus
                      url: http://192.168.0.241
                      check-url: http://prometheus.monitoring.svc.cluster.local:9090/-/ready
                      icon: di:prometheus
                    - title: Alertmanager
                      url: http://192.168.0.242
                      check-url: http://alertmanager.monitoring.svc.cluster.local:9093/-/ready
                      icon: di:alertmanager
                    - title: ntfy
                      url: http://192.168.0.222
                      check-url: http://ntfy.networking.svc.cluster.local/v1/health
                      icon: di:ntfy

                - type: monitor
                  title: Infrastructure
                  cache: 1m
                  style: compact
                  sites:
                    - title: ArgoCD
                      url: https://192.168.0.203
                      icon: di:argo-cd
                      allow-insecure: true
                    - title: Proxmox
                      url: https://192.168.0.254:8006
                      icon: di:proxmox
                      allow-insecure: true
                    - title: TrueNAS
                      url: http://192.168.0.252
                      icon: di:truenas
                    - title: Envoy Gateway
                      url: http://192.168.0.201
                      icon: mdi:router-network
                      alt-status-codes: [404]
                    - title: Router
                      url: http://192.168.0.1
                      icon: mdi:router-wireless

        # ── right: what the house is doing right now ─────────────────────────────────────
        - size: small
          widgets:
            - type: custom-api
              title: Now streaming
              title-url: http://192.168.0.230:32400/web
              cache: 30s
              url: http://plex.media.svc.cluster.local:32400/status/sessions
              headers:
                Accept: application/json
                X-Plex-Token: ${PLEX_TOKEN}
              template: |
                {{ $sessions := .JSON.Array "MediaContainer.Metadata" }}
                {{ if ne .Response.StatusCode 200 }}
                  <div class="hl-fail">Plex answered {{ .Response.Status }}</div>
                {{ else if eq (len $sessions) 0 }}
                  <div class="hl-empty">Nothing playing</div>
                {{ else }}
                  <ul class="list list-gap-20">
                  {{ range $sessions }}
                    {{ $duration := .Int "duration" }}
                    <li>
                      <div class="flex justify-between gap-10 items-center">
                        <div class="color-highlight text-truncate">{{ if eq (.String "type") "episode" }}{{ .String "grandparentTitle" }}{{ else }}{{ .String "title" }}{{ end }}</div>
                        <div class="size-h6 shrink-0 {{ if eq (.String "Player.state") "playing" }}color-positive{{ else }}color-subdue{{ end }}">{{ .String "Player.state" }}</div>
                      </div>
                      <div class="size-h6 color-paragraph text-truncate">
                        {{ if eq (.String "type") "episode" }}S{{ .Int "parentIndex" }} · E{{ .Int "index" }} · {{ .String "title" }} · {{ end }}{{ .String "User.title" }} on {{ .String "Player.title" }}
                      </div>
                      {{ if gt $duration 0 }}
                      <div class="hl-bar hl-thin"><span style="--p: {{ div (mul (.Int "viewOffset") 100) $duration }}"></span></div>
                      {{ end }}
                    </li>
                  {{ end }}
                  </ul>
                {{ end }}

            # qBittorrent authenticates with a session cookie, so the widget's own request IS
            # the login and the template carries the cookie into the real calls. The cookie is
            # `SID` before qBittorrent 5 and `QBT_SID_<port>` after; the match takes either.
            # Keep QB_PASS free of `&` — it goes into a form body as-is.
            - type: custom-api
              title: Downloads
              title-url: http://192.168.0.234
              cache: 15s
              url: http://qbittorrent.media.svc.cluster.local:8080/api/v2/auth/login
              method: POST
              body-type: string
              body: username=admin&password=${QB_PASS}
              headers:
                Content-Type: application/x-www-form-urlencoded
              skip-json-validation: true
              subrequests:
                sab:
                  url: http://sabnzbd.media.svc.cluster.local:8090/api
                  parameters:
                    mode: queue
                    output: json
                    limit: "3"
                    apikey: ${SAB_KEY}
              template: |
                {{ define "rate" }}{{ if ge . 1048576.0 }}{{ printf "%.1f" (div . 1048576.0) }} MB/s{{ else if ge . 1024.0 }}{{ printf "%.0f" (div . 1024.0) }} KB/s{{ else }}idle{{ end }}{{ end }}
                {{ $cookie := findMatch "[A-Za-z_]*SID[A-Za-z0-9_]*=[^;]+" (.Response.Header.Get "Set-Cookie") }}
                {{ $transfer := newRequest "http://qbittorrent.media.svc.cluster.local:8080/api/v2/transfer/info" | withHeader "Cookie" $cookie | getResponse }}
                {{ $active := newRequest "http://qbittorrent.media.svc.cluster.local:8080/api/v2/torrents/info" | withParameter "filter" "downloading" | withParameter "sort" "progress" | withParameter "reverse" "true" | withParameter "limit" "3" | withHeader "Cookie" $cookie | getResponse }}
                {{ $sab := (.Subrequest "sab").JSON }}
                {{/* SABnzbd answers a bad key with 200 and {"status": false, "error": …} */}}
                {{ $qbOK := eq $transfer.Response.StatusCode 200 }}
                {{ $sabOK := and (eq (.Subrequest "sab").Response.StatusCode 200) ($sab.Exists "queue") }}

                <div class="hl-stats">
                  <div>
                    <div class="hl-label">Torrents ↓</div>
                    <div class="hl-value hl-value-sm">{{ if $qbOK }}{{ template "rate" ($transfer.JSON.Float "dl_info_speed") }}{{ else }}<span class="color-negative">login failed</span>{{ end }}</div>
                  </div>
                  <div>
                    <div class="hl-label">Usenet ↓</div>
                    <div class="hl-value hl-value-sm">{{ if $sabOK }}{{ template "rate" (mul ($sab.Float "queue.kbpersec") 1024.0) }}{{ else }}<span class="color-negative">{{ or ($sab.String "error") "unreachable" }}</span>{{ end }}</div>
                  </div>
                </div>

                {{ $torrents := $active.JSON.Array "" }}
                {{ $slots := $sab.Array "queue.slots" }}
                {{ if and (eq (len $torrents) 0) (eq (len $slots) 0) }}
                  {{ if and $qbOK $sabOK }}<div class="hl-empty margin-top-10">Queues are empty</div>{{ end }}
                {{ else }}
                  <ul class="list list-gap-14 margin-top-20">
                  {{ range $torrents }}
                    <li>
                      <div class="flex justify-between gap-10">
                        <div class="text-truncate">{{ .String "name" }}</div>
                        <div class="size-h6 shrink-0">{{ printf "%.0f" (mul (.Float "progress") 100.0) }}%</div>
                      </div>
                      <div class="hl-bar hl-thin"><span style="--p: {{ printf "%.0f" (mul (.Float "progress") 100.0) }}"></span></div>
                    </li>
                  {{ end }}
                  {{ range $slots }}
                    <li>
                      <div class="flex justify-between gap-10">
                        <div class="text-truncate">{{ .String "filename" }}</div>
                        <div class="size-h6 shrink-0">{{ .String "percentage" }}%</div>
                      </div>
                      <div class="hl-bar hl-thin"><span style="--p: {{ .Int "percentage" }}"></span></div>
                    </li>
                  {{ end }}
                  </ul>
                {{ end }}

            - type: bookmarks
              title: Elsewhere
              groups:
                - links:
                    - title: Tailscale admin
                      url: https://login.tailscale.com/admin/machines
                      icon: di:tailscale
                    - title: openGym (public)
                      url: https://fitness.isaacwallace.dev
                      icon: mdi:dumbbell
                    - title: homelab-k8s
                      url: https://github.com/isaacwallace123/homelab-k8s
                      icon: si:github

  media.yml: |
    - name: Media
      columns:
        - size: full
          widgets:
            - type: custom-api
              title: In the queue
              cache: 1m
              subrequests:
                radarr:
                  url: http://radarr.media.svc.cluster.local:7878/api/v3/queue
                  headers:
                    X-Api-Key: ${RADARR_KEY}
                  parameters:
                    pageSize: "10"
                    includeMovie: "true"
                sonarr:
                  url: http://sonarr.media.svc.cluster.local:8989/api/v3/queue
                  headers:
                    X-Api-Key: ${SONARR_KEY}
                  parameters:
                    pageSize: "10"
                    includeSeries: "true"
                    includeEpisode: "true"
              template: |
                {{ define "row" }}
                  {{ $size := .Float "size" }}
                  <li>
                    <div class="flex justify-between gap-10 items-center">
                      <div class="min-width-0">
                        <div class="color-highlight text-truncate">{{ if .Exists "series.title" }}{{ .String "series.title" }} <span class="color-subdue">S{{ .Int "episode.seasonNumber" }}E{{ .Int "episode.episodeNumber" }}</span>{{ else if .Exists "movie.title" }}{{ .String "movie.title" }} <span class="color-subdue">{{ .Int "movie.year" }}</span>{{ else }}{{ .String "title" }}{{ end }}</div>
                        <div class="size-h6 color-paragraph text-truncate">{{ .String "status" }}{{ if .Exists "timeleft" }} · {{ .String "timeleft" }} left{{ end }}{{ if ne (.String "trackedDownloadState") "downloading" }} · {{ .String "trackedDownloadState" }}{{ end }}</div>
                      </div>
                      {{ if gt $size 0.0 }}<div class="size-h6 shrink-0">{{ printf "%.0f" (mul (div (sub $size (.Float "sizeleft")) $size) 100.0) }}%</div>{{ end }}
                    </div>
                    {{ if gt $size 0.0 }}<div class="hl-bar hl-thin"><span style="--p: {{ printf "%.0f" (mul (div (sub $size (.Float "sizeleft")) $size) 100.0) }}"></span></div>{{ end }}
                  </li>
                {{ end }}
                {{ $movies := (.Subrequest "radarr").JSON.Array "records" }}
                {{ $shows := (.Subrequest "sonarr").JSON.Array "records" }}
                {{ if ne (.Subrequest "radarr").Response.StatusCode 200 }}<div class="hl-fail">Radarr answered {{ (.Subrequest "radarr").Response.Status }}</div>{{ end }}
                {{ if ne (.Subrequest "sonarr").Response.StatusCode 200 }}<div class="hl-fail">Sonarr answered {{ (.Subrequest "sonarr").Response.Status }}</div>{{ end }}
                {{ if and (eq (len $movies) 0) (eq (len $shows) 0) }}
                  {{ if and (eq (.Subrequest "radarr").Response.StatusCode 200) (eq (.Subrequest "sonarr").Response.StatusCode 200) }}<div class="hl-empty">Nothing downloading</div>{{ end }}
                {{ else }}
                  <ul class="list list-gap-14">
                    {{ range $movies }}{{ template "row" . }}{{ end }}
                    {{ range $shows }}{{ template "row" . }}{{ end }}
                  </ul>
                {{ end }}

            - type: split-column
              max-columns: 2
              widgets:
                # The calendar window has to move with the clock, so these requests are built in
                # the template rather than declared — `parameters` cannot hold a moving date.
                - type: custom-api
                  title: Airing this week
                  title-url: http://192.168.0.232/calendar
                  cache: 30m
                  template: |
                    {{ $episodes := newRequest "http://sonarr.media.svc.cluster.local:8989/api/v3/calendar"
                      | withHeader "X-Api-Key" "${SONARR_KEY}"
                      | withParameter "start" (formatTime "rfc3339" (startOfDay now))
                      | withParameter "end" (formatTime "rfc3339" (offsetNow "168h"))
                      | withParameter "includeSeries" "true"
                      | getResponse }}
                    {{ $list := $episodes.JSON.Array "" }}
                    {{ if ne $episodes.Response.StatusCode 200 }}
                      <div class="hl-fail">Sonarr answered {{ $episodes.Response.Status }}</div>
                    {{ else if eq (len $list) 0 }}
                      <div class="hl-empty">Nothing scheduled</div>
                    {{ else }}
                      <ul class="list list-gap-14">
                      {{ range $list }}
                        <li class="flex justify-between gap-10">
                          <div class="min-width-0">
                            <div class="color-highlight text-truncate">{{ .String "series.title" }}</div>
                            <div class="size-h6 color-paragraph text-truncate">S{{ .Int "seasonNumber" }}E{{ .Int "episodeNumber" }} · {{ .String "title" }}</div>
                          </div>
                          <div class="size-h6 shrink-0 text-right {{ if .Bool "hasFile" }}color-positive{{ end }}">{{ formatTime "Mon 3PM" (parseTime "rfc3339" (.String "airDateUtc")) }}</div>
                        </li>
                      {{ end }}
                      </ul>
                    {{ end }}

                - type: custom-api
                  title: Movies this month
                  title-url: http://192.168.0.231/calendar
                  cache: 30m
                  template: |
                    {{ $movies := newRequest "http://radarr.media.svc.cluster.local:7878/api/v3/calendar"
                      | withHeader "X-Api-Key" "${RADARR_KEY}"
                      | withParameter "start" (formatTime "rfc3339" (startOfDay now))
                      | withParameter "end" (formatTime "rfc3339" (offsetNow "720h"))
                      | getResponse }}
                    {{ $list := $movies.JSON.Array "" }}
                    {{ if ne $movies.Response.StatusCode 200 }}
                      <div class="hl-fail">Radarr answered {{ $movies.Response.Status }}</div>
                    {{ else if eq (len $list) 0 }}
                      <div class="hl-empty">Nothing releasing</div>
                    {{ else }}
                      <ul class="list list-gap-14">
                      {{ range $list }}
                        {{ $when := or (.String "digitalRelease") (.String "physicalRelease") (.String "inCinemas") }}
                        <li class="flex justify-between gap-10">
                          <div class="min-width-0">
                            <div class="color-highlight text-truncate">{{ .String "title" }}</div>
                            <div class="size-h6 color-paragraph">{{ if .Exists "digitalRelease" }}Digital{{ else if .Exists "physicalRelease" }}Physical{{ else }}Cinemas{{ end }}</div>
                          </div>
                          <div class="size-h6 shrink-0 text-right {{ if .Bool "hasFile" }}color-positive{{ end }}">{{ formatTime "Jan 2" (parseTime "rfc3339" $when) }}</div>
                        </li>
                      {{ end }}
                      </ul>
                    {{ end }}

        - size: small
          widgets:
            # No artwork on purpose: Plex only serves thumbnails with the token in the URL,
            # which would put it in the page source for anyone on the LAN.
            - type: custom-api
              title: Recently added
              title-url: http://192.168.0.230:32400/web
              cache: 10m
              url: http://plex.media.svc.cluster.local:32400/library/recentlyAdded
              headers:
                Accept: application/json
                X-Plex-Token: ${PLEX_TOKEN}
              parameters:
                X-Plex-Container-Start: "0"
                X-Plex-Container-Size: "6"
              template: |
                {{ if ne .Response.StatusCode 200 }}
                  <div class="hl-fail">Plex answered {{ .Response.Status }}</div>
                {{ else }}
                  {{ $items := .JSON.Array "MediaContainer.Metadata" }}
                  {{ if eq (len $items) 0 }}
                    <div class="hl-empty">Nothing added recently</div>
                  {{ else }}
                    <ul class="list list-gap-14">
                    {{ range $items }}
                      <li>
                        <div class="color-highlight text-truncate">{{ if eq (.String "type") "episode" }}{{ .String "grandparentTitle" }}{{ else }}{{ .String "title" }}{{ end }}</div>
                        <div class="size-h6 color-paragraph text-truncate">
                          {{ if eq (.String "type") "episode" }}S{{ .Int "parentIndex" }}E{{ .Int "index" }} · {{ .String "title" }}{{ else if .Exists "year" }}{{ .Int "year" }}{{ end }}
                          · <span {{ parseRelativeTime "unix" (.String "addedAt") }}></span>
                        </div>
                      </li>
                    {{ end }}
                    </ul>
                  {{ end }}
                {{ end }}

            - type: custom-api
              title: Library space
              cache: 30m
              subrequests:
                radarr:
                  url: http://radarr.media.svc.cluster.local:7878/api/v3/diskspace
                  headers:
                    X-Api-Key: ${RADARR_KEY}
                sonarr:
                  url: http://sonarr.media.svc.cluster.local:8989/api/v3/diskspace
                  headers:
                    X-Api-Key: ${SONARR_KEY}
              template: |
                {{/* The *arr diskspace endpoint reports every mount in the container —
                     /config, /dev/termination-log and the node's own root among them. Only
                     the media shares are worth a row, and they are the only ones this big. */}}
                {{ define "disk" }}
                  {{ $free := .Float "freeSpace" }}
                  {{ $total := .Float "totalSpace" }}
                  {{ if gt $total 214748364800.0 }}
                    {{ $used := mul (div (sub $total $free) $total) 100.0 }}
                    <li>
                      <div class="flex justify-between gap-10 items-center">
                        <div class="text-truncate">{{ .String "path" }}</div>
                        <div class="color-highlight shrink-0">{{ if ge $free 1099511627776.0 }}{{ printf "%.1f" (div $free 1099511627776.0) }}<small> TiB free</small>{{ else }}{{ printf "%.0f" (div $free 1073741824.0) }}<small> GiB free</small>{{ end }}</div>
                      </div>
                      <div class="hl-bar hl-thin{{ if ge $used 90.0 }} hl-hot{{ end }}"><span style="--p: {{ printf "%.0f" $used }}"></span></div>
                    </li>
                  {{ end }}
                {{ end }}
                {{ $radarr := (.Subrequest "radarr") }}
                {{ $sonarr := (.Subrequest "sonarr") }}
                {{ if and (ne $radarr.Response.StatusCode 200) (ne $sonarr.Response.StatusCode 200) }}
                  <div class="hl-fail">Radarr answered {{ $radarr.Response.Status }} · Sonarr answered {{ $sonarr.Response.Status }}</div>
                {{ else }}
                  <ul class="list list-gap-14">
                  {{ range $radarr.JSON.Array "" }}
                    {{ template "disk" . }}
                  {{ end }}
                  {{/* Both apps mount the same media share, so a path Radarr already
                       reported is skipped rather than drawn twice. */}}
                  {{ range $sonarr.JSON.Array "" }}
                    {{ $path := .String "path" }}
                    {{ $duplicate := false }}
                    {{ range $radarr.JSON.Array "" }}{{ if eq (.String "path") $path }}{{ $duplicate = true }}{{ end }}{{ end }}
                    {{ if not $duplicate }}{{ template "disk" . }}{{ end }}
                  {{ end }}
                  </ul>
                {{ end }}

            - type: custom-api
              title: Requests
              title-url: http://192.168.0.236
              cache: 5m
              url: http://overseerr.media.svc.cluster.local:5055/api/v1/request/count
              headers:
                X-Api-Key: ${OVERSEERR_KEY}
              template: |
                {{ if ne .Response.StatusCode 200 }}
                <div class="hl-fail">Overseerr answered {{ .Response.Status }}</div>
                {{ else }}
                <div class="hl-stats">
                  <div>
                    <div class="hl-label">Pending</div>
                    <div class="hl-value{{ if gt (.JSON.Int "pending") 0 }} color-primary{{ end }}">{{ .JSON.Int "pending" }}</div>
                  </div>
                  <div>
                    <div class="hl-label">Processing</div>
                    <div class="hl-value">{{ .JSON.Int "processing" }}</div>
                  </div>
                  <div>
                    <div class="hl-label">Available</div>
                    <div class="hl-value">{{ .JSON.Int "available" }}</div>
                  </div>
                  <div>
                    <div class="hl-label">Total</div>
                    <div class="hl-value">{{ .JSON.Int "total" }}</div>
                  </div>
                </div>
                {{ end }}

            # Only what needs a human: an empty list is the good state.
            - type: custom-api
              title: Health
              cache: 5m
              subrequests:
                Radarr:
                  url: http://radarr.media.svc.cluster.local:7878/api/v3/health
                  headers:
                    X-Api-Key: ${RADARR_KEY}
                Sonarr:
                  url: http://sonarr.media.svc.cluster.local:8989/api/v3/health
                  headers:
                    X-Api-Key: ${SONARR_KEY}
                Prowlarr:
                  url: http://prowlarr.media.svc.cluster.local:9696/api/v1/health
                  headers:
                    X-Api-Key: ${PROWLARR_KEY}
              template: |
                {{ $r := (.Subrequest "Radarr").JSON.Array "" }}
                {{ $s := (.Subrequest "Sonarr").JSON.Array "" }}
                {{ $p := (.Subrequest "Prowlarr").JSON.Array "" }}
                {{ $reachable := and (eq (.Subrequest "Radarr").Response.StatusCode 200) (eq (.Subrequest "Sonarr").Response.StatusCode 200) (eq (.Subrequest "Prowlarr").Response.StatusCode 200) }}
                {{ if ne (.Subrequest "Radarr").Response.StatusCode 200 }}<div class="hl-fail">Radarr answered {{ (.Subrequest "Radarr").Response.Status }}</div>{{ end }}
                {{ if ne (.Subrequest "Sonarr").Response.StatusCode 200 }}<div class="hl-fail">Sonarr answered {{ (.Subrequest "Sonarr").Response.Status }}</div>{{ end }}
                {{ if ne (.Subrequest "Prowlarr").Response.StatusCode 200 }}<div class="hl-fail">Prowlarr answered {{ (.Subrequest "Prowlarr").Response.Status }}</div>{{ end }}
                {{ if and $reachable (eq (len $r) 0) (eq (len $s) 0) (eq (len $p) 0) }}
                  <div class="hl-allclear"><span class="hl-dot"></span>Radarr, Sonarr and Prowlarr are healthy</div>
                {{ else }}
                  <ul class="list list-gap-14">
                  {{ range $r }}<li class="flex gap-10 items-start"><span class="hl-dot {{ if eq (.String "type") "error" }}hl-bad{{ else }}hl-warn{{ end }}"></span><div class="min-width-0"><div class="color-highlight">Radarr</div><div class="size-h6 color-paragraph">{{ .String "message" }}</div></div></li>{{ end }}
                  {{ range $s }}<li class="flex gap-10 items-start"><span class="hl-dot {{ if eq (.String "type") "error" }}hl-bad{{ else }}hl-warn{{ end }}"></span><div class="min-width-0"><div class="color-highlight">Sonarr</div><div class="size-h6 color-paragraph">{{ .String "message" }}</div></div></li>{{ end }}
                  {{ range $p }}<li class="flex gap-10 items-start"><span class="hl-dot {{ if eq (.String "type") "error" }}hl-bad{{ else }}hl-warn{{ end }}"></span><div class="min-width-0"><div class="color-highlight">Prowlarr</div><div class="size-h6 color-paragraph">{{ .String "message" }}</div></div></li>{{ end }}
                  </ul>
                {{ end }}
  cluster.yml: |
    - name: Cluster
      columns:
        - size: full
          widgets:
            # One row per node. Prometheus returns a separate series per metric, so the
            # template walks the CPU series and looks up the matching node in the others.
            # `job="node-exporter"` because the pod-annotation scrape returns these same
            # metrics again WITHOUT a node label, which would double every row.
            - type: custom-api
              title: Nodes
              title-url: http://192.168.0.240
              cache: 30s
              subrequests:
                cpu:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: '100 - (avg by (node) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])) * 100)'
                mem:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: '(1 - sum by (node) (node_memory_MemAvailable_bytes{job="node-exporter"}) / sum by (node) (node_memory_MemTotal_bytes{job="node-exporter"})) * 100'
                disk:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'max by (node) (1 - node_filesystem_avail_bytes{job="node-exporter",mountpoint="/"} / node_filesystem_size_bytes{job="node-exporter",mountpoint="/"}) * 100'
                boot:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'min by (node) (node_boot_time_seconds{job="node-exporter"})'
              template: |
                {{ define "meter" }}<div class="hl-node-value">{{ printf "%.0f" . }}<small>%</small></div><div class="hl-bar hl-thin{{ if ge . 85.0 }} hl-hot{{ end }}"><span style="--p: {{ printf "%.0f" . }}"></span></div>{{ end }}
                {{ $mem := (.Subrequest "mem").JSON.Array "data.result" }}
                {{ $disk := (.Subrequest "disk").JSON.Array "data.result" }}
                {{ $boot := (.Subrequest "boot").JSON.Array "data.result" }}
                {{ $nodes := sortByString "metric.node" "asc" ((.Subrequest "cpu").JSON.Array "data.result") }}
                {{ if ne (.Subrequest "cpu").Response.StatusCode 200 }}
                  <div class="hl-fail">Prometheus answered {{ (.Subrequest "cpu").Response.Status }}</div>
                {{ else if eq (len $nodes) 0 }}
                  <div class="hl-fail">No node-exporter series returned</div>
                {{ else }}
                  <ul class="list list-gap-14">
                  {{ range $nodes }}
                    {{ $node := .String "metric.node" }}
                    <li class="hl-node">
                      <div class="hl-node-name">
                        <div class="color-highlight text-truncate">{{ $node }}</div>
                        {{ range $boot }}{{ if eq (.String "metric.node") $node }}<div class="size-h6 color-paragraph">up <span {{ parseRelativeTime "unix" (.String "value.1") }}></span></div>{{ end }}{{ end }}
                      </div>
                      <div class="hl-node-stats">
                        <div class="hl-node-cell">
                          <div class="hl-label">CPU</div>
                          {{ template "meter" (.Float "value.1") }}
                        </div>
                        <div class="hl-node-cell">
                          <div class="hl-label">Memory</div>
                          {{ range $mem }}{{ if eq (.String "metric.node") $node }}{{ template "meter" (.Float "value.1") }}{{ end }}{{ end }}
                        </div>
                        <div class="hl-node-cell">
                          <div class="hl-label">Disk</div>
                          {{ range $disk }}{{ if eq (.String "metric.node") $node }}{{ template "meter" (.Float "value.1") }}{{ end }}{{ end }}
                        </div>
                      </div>
                    </li>
                  {{ end }}
                  </ul>
                {{ end }}

            - type: split-column
              max-columns: 2
              widgets:
                # cAdvisor is the only pod-level source here — there is no kube-state-metrics —
                # so these are container working set and CPU rate, summed per pod. The regex
                # drops the ReplicaSet hash so a pod reads as the thing it belongs to.
                - type: custom-api
                  title: Most memory
                  cache: 1m
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'topk(6, sum by (namespace, pod) (container_memory_working_set_bytes{container!="",pod!=""}))'
                  template: |
                    {{ if ne .Response.StatusCode 200 }}
                      <div class="hl-fail">Prometheus answered {{ .Response.Status }}</div>
                    {{ else }}
                      <ul class="list list-gap-10">
                      {{ range .JSON.Array "data.result" }}
                        <li class="flex justify-between gap-10 items-center">
                          <div class="min-width-0">
                            <div class="text-truncate">{{ replaceMatches "-[a-f0-9]{6,10}-[a-z0-9]{5}$|-[a-f0-9]{16,}$|-[0-9]+$" "" (.String "metric.pod") }}</div>
                            <div class="size-h6 color-paragraph">{{ .String "metric.namespace" }}</div>
                          </div>
                          <div class="color-highlight shrink-0">{{ printf "%.1f" (div (.Float "value.1") 1073741824.0) }}<small> GiB</small></div>
                        </li>
                      {{ end }}
                      </ul>
                    {{ end }}

                - type: custom-api
                  title: Most CPU
                  cache: 1m
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'topk(6, sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!="",pod!=""}[5m])))'
                  template: |
                    {{ if ne .Response.StatusCode 200 }}
                      <div class="hl-fail">Prometheus answered {{ .Response.Status }}</div>
                    {{ else }}
                      <ul class="list list-gap-10">
                      {{ range .JSON.Array "data.result" }}
                        <li class="flex justify-between gap-10 items-center">
                          <div class="min-width-0">
                            <div class="text-truncate">{{ replaceMatches "-[a-f0-9]{6,10}-[a-z0-9]{5}$|-[a-f0-9]{16,}$|-[0-9]+$" "" (.String "metric.pod") }}</div>
                            <div class="size-h6 color-paragraph">{{ .String "metric.namespace" }}</div>
                          </div>
                          <div class="color-highlight shrink-0">{{ printf "%.0f" (mul (.Float "value.1") 1000.0) }}<small> m</small></div>
                        </li>
                      {{ end }}
                      </ul>
                    {{ end }}

        - size: small
          widgets:
            # ── Kubernetes API, read-only ──────────────────────────────────────────────────
            # allow-insecure because the API server presents the cluster CA, which Glance has
            # no way to trust — the connection never leaves the node's own network namespace.
            - type: custom-api
              title: GitOps
              title-url: https://192.168.0.203
              cache: 1m
              url: https://kubernetes.default.svc/apis/argoproj.io/v1alpha1/applications
              allow-insecure: true
              headers:
                Authorization: Bearer ${K8S_TOKEN}
              template: |
                {{ if ne .Response.StatusCode 200 }}
                  <div class="hl-fail">Kubernetes API answered {{ .Response.Status }}</div>
                {{ else }}
                  {{ $apps := .JSON.Array "items" }}
                  {{ $bad := 0 }}
                  {{ range $apps }}
                    {{ if or (ne (.String "status.sync.status") "Synced") (ne (.String "status.health.status") "Healthy") }}{{ $bad = add $bad 1 }}{{ end }}
                  {{ end }}
                  <div class="hl-stats">
                    <div>
                      <div class="hl-label">Applications</div>
                      <div class="hl-value">{{ len $apps }}</div>
                    </div>
                    <div>
                      <div class="hl-label">Need attention</div>
                      <div class="hl-value{{ if gt $bad 0 }} color-negative{{ end }}">{{ $bad }}</div>
                    </div>
                  </div>
                  <div class="margin-top-15">
                  {{ if eq $bad 0 }}
                    <div class="hl-allclear"><span class="hl-dot"></span>Everything synced and healthy</div>
                  {{ else }}
                    <ul class="list list-gap-10">
                    {{ range $apps }}
                      {{ $synced := eq (.String "status.sync.status") "Synced" }}
                      {{ $healthy := eq (.String "status.health.status") "Healthy" }}
                      {{ if not (and $synced $healthy) }}
                      <li class="flex gap-10 items-start">
                        <span class="hl-dot {{ if eq (.String "status.health.status") "Degraded" }}hl-bad{{ else }}hl-warn{{ end }}"></span>
                        <div class="min-width-0">
                          <div class="color-highlight text-truncate">{{ .String "metadata.name" }}</div>
                          <div class="size-h6 color-paragraph">{{ .String "status.sync.status" }} · {{ .String "status.health.status" }}</div>
                        </div>
                      </li>
                      {{ end }}
                    {{ end }}
                    </ul>
                  {{ end }}
                  </div>
                {{ end }}

            # There is no kube-state-metrics here, so pod health comes from the API directly.
            # Anything not Running-and-ready is listed, plus whatever is stacking up restarts:
            # a pod that restarted twenty times an hour ago still reads as Running.
            - type: custom-api
              title: Pods
              cache: 1m
              url: https://kubernetes.default.svc/api/v1/pods
              allow-insecure: true
              headers:
                Authorization: Bearer ${K8S_TOKEN}
              parameters:
                limit: "500"
              template: |
                {{ if ne .Response.StatusCode 200 }}
                  <div class="hl-fail">Kubernetes API answered {{ .Response.Status }}</div>
                {{ else }}
                  {{ $pods := .JSON.Array "items" }}
                  {{ $running := 0 }}
                  {{ $restarts := 0 }}
                  {{ range $pods }}
                    {{ if eq (.String "status.phase") "Running" }}{{ $running = add $running 1 }}{{ end }}
                    {{ range .Array "status.containerStatuses" }}{{ $restarts = add $restarts (.Int "restartCount") }}{{ end }}
                  {{ end }}
                  <div class="hl-stats">
                    <div>
                      <div class="hl-label">Running</div>
                      <div class="hl-value">{{ $running }}<small>/ {{ len $pods }}</small></div>
                    </div>
                    <div>
                      <div class="hl-label">Restarts</div>
                      <div class="hl-value">{{ $restarts }}</div>
                    </div>
                  </div>
                  <div class="margin-top-15">
                  <ul class="list list-gap-10">
                  {{ $listed := 0 }}
                  {{ range $pods }}
                    {{ $phase := .String "status.phase" }}
                    {{ $waiting := "" }}
                    {{ $worst := 0 }}
                    {{ $recent := false }}
                    {{ range .Array "status.containerStatuses" }}
                      {{ if gt (.Int "restartCount") $worst }}{{ $worst = .Int "restartCount" }}{{ end }}
                      {{ if .Exists "state.waiting.reason" }}{{ $waiting = .String "state.waiting.reason" }}{{ end }}
                      {{/* restartCount only ever grows, so on its own it flags pods that
                           settled weeks ago. The last exit time is what says "still bad". */}}
                      {{ if .Exists "lastState.terminated.finishedAt" }}
                        {{ if gt (parseTime "rfc3339" (.String "lastState.terminated.finishedAt")).Unix (offsetNow "-24h").Unix }}{{ $recent = true }}{{ end }}
                      {{ end }}
                    {{ end }}
                    {{ if or (and (ne $phase "Running") (ne $phase "Succeeded")) (ne $waiting "") (and $recent (ge $worst 3)) }}
                      {{ $listed = add $listed 1 }}
                      <li class="flex gap-10 items-start">
                        <span class="hl-dot {{ if or (eq $phase "Failed") (eq $waiting "CrashLoopBackOff") }}hl-bad{{ else }}hl-warn{{ end }}"></span>
                        <div class="min-width-0">
                          <div class="color-highlight text-truncate">{{ .String "metadata.name" }}</div>
                          <div class="size-h6 color-paragraph text-truncate">{{ .String "metadata.namespace" }} · {{ if ne $waiting "" }}{{ $waiting }}{{ else }}{{ $phase }}{{ end }}{{ if and $recent (ge $worst 3) }} · {{ $worst }} restarts, last restarted today{{ end }}</div>
                        </div>
                      </li>
                    {{ end }}
                  {{ end }}
                  </ul>
                  {{ if eq $listed 0 }}
                    <div class="hl-allclear"><span class="hl-dot"></span>Every pod is running</div>
                  {{ end }}
                  </div>
                {{ end }}

            # Envoy counts requests per listener. `admin`, `eg-stats-http` and `eg-ready-http`
            # are Envoy talking to itself (metrics scrapes and health checks), so they are
            # filtered out — leaving the LAN gateway and the public edge.
            - type: custom-api
              title: Gateway
              cache: 2m
              subrequests:
                rate:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'sum(rate(envoy_http_downstream_rq_completed{envoy_http_conn_manager_prefix!~"admin|eg-.*"}[10m])) * 60'
                active:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'sum(envoy_http_downstream_cx_active{envoy_http_conn_manager_prefix!~"admin|eg-.*"})'
                classes:
                  url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
                  parameters:
                    query: 'sum by (envoy_response_code_class) (increase(envoy_http_downstream_rq_xx{envoy_http_conn_manager_prefix!~"admin|eg-.*"}[24h]))'
              template: |
                {{ if ne (.Subrequest "rate").Response.StatusCode 200 }}
                  <div class="hl-fail">Prometheus answered {{ (.Subrequest "rate").Response.Status }}</div>
                {{ else }}
                  <div class="hl-stats">
                    <div>
                      <div class="hl-label">Requests</div>
                      <div class="hl-value">{{ printf "%.1f" ((.Subrequest "rate").JSON.Float "data.result.0.value.1") }}<small>/min</small></div>
                    </div>
                    <div>
                      <div class="hl-label">Open connections</div>
                      <div class="hl-value">{{ printf "%.0f" ((.Subrequest "active").JSON.Float "data.result.0.value.1") }}</div>
                    </div>
                  </div>
                  <div class="hl-label margin-top-15">Last 24 hours</div>
                  <ul class="list list-gap-4 margin-top-5">
                  {{ range (.Subrequest "classes").JSON.Array "data.result" }}
                    {{ $class := .String "metric.envoy_response_code_class" }}
                    {{ $count := .Float "value.1" }}
                    {{ if gt $count 0.0 }}
                      <li class="flex justify-between gap-10">
                        <div class="{{ if eq $class "5" }}color-negative{{ else if eq $class "4" }}color-primary{{ end }}">{{ $class }}xx</div>
                        <div class="color-highlight">{{ formatNumber (toInt $count) }}</div>
                      </li>
                    {{ end }}
                  {{ end }}
                  </ul>
                {{ end }}

            # Longhorn's own API, which needs no credentials from inside the cluster. Volume
            # health is the thing worth watching: two entries in docs/incidents started here.
            - type: custom-api
              title: Storage
              cache: 2m
              url: http://longhorn-backend.longhorn-system.svc.cluster.local:9500/v1/volumes
              template: |
                {{ if ne .Response.StatusCode 200 }}
                  <div class="hl-fail">Longhorn answered {{ .Response.Status }}</div>
                {{ else }}
                  {{ $vols := .JSON.Array "data" }}
                  {{ $unhealthy := 0 }}
                  {{ $provisioned := 0.0 }}
                  {{ range $vols }}
                    {{ if or (ne (.String "robustness") "healthy") (ne (.String "state") "attached") }}{{ $unhealthy = add $unhealthy 1 }}{{ end }}
                    {{ $provisioned = add $provisioned (.Float "size") }}
                  {{ end }}
                  <div class="hl-stats">
                    <div>
                      <div class="hl-label">Volumes</div>
                      <div class="hl-value">{{ len $vols }}</div>
                    </div>
                    <div>
                      <div class="hl-label">Provisioned</div>
                      <div class="hl-value">{{ printf "%.0f" (div $provisioned 1073741824.0) }}<small>GiB</small></div>
                    </div>
                  </div>
                  <div class="margin-top-15">
                  {{ if eq $unhealthy 0 }}
                    <div class="hl-allclear"><span class="hl-dot"></span>All volumes attached and healthy</div>
                  {{ else }}
                    <ul class="list list-gap-10">
                    {{ range $vols }}
                      {{ if or (ne (.String "robustness") "healthy") (ne (.String "state") "attached") }}
                      <li class="flex gap-10 items-start">
                        <span class="hl-dot {{ if eq (.String "robustness") "faulted" }}hl-bad{{ else }}hl-warn{{ end }}"></span>
                        <div class="min-width-0">
                          <div class="color-highlight text-truncate">{{ or (.String "kubernetesStatus.pvcName") (.String "name") }}</div>
                          <div class="size-h6 color-paragraph">{{ .String "state" }} · {{ .String "robustness" }} · {{ .Int "numberOfReplicas" }} replicas</div>
                        </div>
                      </li>
                      {{ end }}
                    {{ end }}
                    </ul>
                  {{ end }}
                  </div>
                  {{ $oldest := "" }}
                  {{ range sortByString "lastBackupAt" "asc" $vols }}{{ if and (eq $oldest "") (ne (.String "lastBackupAt") "") }}{{ $oldest = .String "lastBackupAt" }}{{ end }}{{ end }}
                  <div class="size-h6 color-paragraph margin-top-15">
                    {{ if eq $oldest "" }}No volume reports a backup{{ else }}Oldest backup <span {{ parseRelativeTime "rfc3339" $oldest }}></span> · runs Saturdays 03:00{{ end }}
                  </div>
                {{ end }}

            # cert-manager exports an expiry timestamp per Certificate. The LAN wildcard and the
            # ArgoCD cert renew themselves; this is here to catch the renewal that did not.
            - type: custom-api
              title: Certificates
              cache: 1h
              url: http://prometheus.monitoring.svc.cluster.local:9090/api/v1/query
              parameters:
                query: 'sort((certmanager_certificate_expiration_timestamp_seconds - time()) / 86400)'
              template: |
                {{ if ne .Response.StatusCode 200 }}
                  <div class="hl-fail">Prometheus answered {{ .Response.Status }}</div>
                {{ else }}
                  {{ $certs := .JSON.Array "data.result" }}
                  {{ if eq (len $certs) 0 }}
                    <div class="hl-empty">No certificates reported</div>
                  {{ else }}
                    <ul class="list list-gap-10">
                    {{ range $certs }}
                      {{ $days := .Float "value.1" }}
                      <li class="flex justify-between gap-10 items-center">
                        <div class="min-width-0">
                          <div class="text-truncate">{{ .String "metric.name" }}</div>
                          <div class="size-h6 color-paragraph">{{ .String "metric.namespace" }}</div>
                        </div>
                        <div class="shrink-0 {{ if lt $days 14.0 }}color-negative{{ else if lt $days 30.0 }}color-primary{{ end }}">{{ printf "%.0f" $days }}<small> days</small></div>
                      </li>
                    {{ end }}
                    </ul>
                  {{ end }}
                {{ end }}

            # Upstream releases for what this cluster actually runs, so a version bump is
            # something noticed here rather than in a changelog months later. Unauthenticated
            # GitHub allows 60 requests an hour; six repos on a 6h cache is nowhere near it.
            - type: releases
              title: Upstream releases
              cache: 6h
              show-source-icon: true
              limit: 8
              collapse-after: 4
              repositories:
                - k3s-io/k3s
                - argoproj/argo-cd
                - longhorn/longhorn
                - glanceapp/glance
                - immich-app/immich
                - cert-manager/cert-manager

