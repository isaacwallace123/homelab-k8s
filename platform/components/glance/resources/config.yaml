data:
  homelab.css: |
    /* Glance ships a monospace face. A system stack reads as the device's own UI — SF Pro on
       the iPad and on macOS, Segoe on Windows — which is most of what makes this feel modern
       rather than terminal-ish. Numbers stay tabular so live figures do not jitter. */
    body,
    input,
    button,
    textarea,
    select {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Display", "Segoe UI",
        Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
      font-feature-settings: "tnum" 1, "cv01" 1;
      -webkit-font-smoothing: antialiased;
    }

    :root {
      --border-radius: 14px;
    }

    .widget-content {
      border-radius: var(--border-radius);
    }

    /* Sans-serif carries uppercase labels worse than mono does — open them up slightly. */
    .widget-header,
    .hl-label {
      letter-spacing: 0.06em;
    }

    .monitor-site-title,
    .size-h3 {
      letter-spacing: -0.01em;
    }

    /* ── stat tiles ─────────────────────────────────────────────────────────── */
    .hl-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.6rem 1.8rem;
    }

    .hl-label {
      font-size: var(--font-size-h6);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-text-subdue);
    }

    .hl-value {
      font-size: var(--font-size-h2);
      line-height: 1.25;
      color: var(--color-text-highlight);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .hl-value small {
      font-size: var(--font-size-h6);
      color: var(--color-text-base);
      margin-left: 0.25em;
    }

    .hl-value-sm {
      font-size: var(--font-size-h4);
    }

    .hl-sub {
      font-size: var(--font-size-h6);
      color: var(--color-text-subdue);
      margin-top: 0.3rem;
    }

    .hl-bar {
      height: 0.5rem;
      margin-top: 0.7rem;
      border-radius: 999px;
      overflow: hidden;
      background: var(--color-widget-background-highlight);
    }

    .hl-bar.hl-thin {
      height: 0.35rem;
      margin-top: 0.5rem;
    }

    .hl-bar > span {
      display: block;
      height: 100%;
      width: calc(var(--p, 0) * 1%);
      max-width: 100%;
      border-radius: inherit;
      background: var(--color-primary);
      transition: width 0.6s ease;
    }

    .hl-bar.hl-hot > span {
      background: var(--color-negative);
    }

    /* ── node rows ──────────────────────────────────────────────────────────── */
    .hl-node {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .hl-node-name {
      flex: 1 1 0;
      min-width: 0;
    }

    .hl-node-stats {
      display: flex;
      gap: 1.4rem;
      flex: 2 1 0;
    }

    .hl-node-cell {
      flex: 1 1 0;
      min-width: 0;
    }

    .hl-node-value {
      font-size: var(--font-size-h4);
      color: var(--color-text-highlight);
      font-variant-numeric: tabular-nums;
      line-height: 1.3;
    }

    .hl-node-value small {
      font-size: var(--font-size-h6);
      color: var(--color-text-base);
      margin-left: 0.15em;
    }

    /* Narrow columns cannot hold name + three meters on one line. */
    @media (max-width: 700px) {
      .hl-node {
        flex-direction: column;
        align-items: stretch;
        gap: 0.6rem;
      }
    }

    /* ── status ─────────────────────────────────────────────────────────────── */
    .hl-dot {
      flex-shrink: 0;
      display: inline-block;
      width: 0.8rem;
      height: 0.8rem;
      margin-top: 0.45rem;
      border-radius: 50%;
      background: var(--color-positive);
      box-shadow: 0 0 0 0.3rem color-mix(in srgb, var(--color-positive) 18%, transparent);
    }

    .hl-dot.hl-warn {
      background: var(--color-primary);
      box-shadow: 0 0 0 0.3rem color-mix(in srgb, var(--color-primary) 18%, transparent);
    }

    .hl-dot.hl-bad {
      background: var(--color-negative);
      box-shadow: 0 0 0 0.3rem color-mix(in srgb, var(--color-negative) 18%, transparent);
    }

    .hl-allclear {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      color: var(--color-text-highlight);
    }

    .hl-allclear .hl-dot {
      margin-top: 0;
    }

    /* A source that could not be read. Never rendered as an empty-but-fine state. */
    .hl-fail {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--color-negative);
      font-size: var(--font-size-h6);
      padding-block: 0.3rem;
    }

    .hl-fail::before {
      content: "";
      flex-shrink: 0;
      width: 0.8rem;
      height: 0.8rem;
      border-radius: 50%;
      background: var(--color-negative);
    }

    .hl-empty {
      text-align: center;
      padding-block: 0.8rem;
      color: var(--color-text-subdue);
    }

    /* ── touch ──────────────────────────────────────────────────────────────── */
    /* Bigger, calmer hit targets; no hover-only affordances that a finger never triggers. */
    @media (hover: none) {
      .monitor-site {
        padding-block: 0.4rem;
      }

      .monitor-site-icon {
        filter: none;
        opacity: 1;
      }
    }

    /* ── tablet ─────────────────────────────────────────────────────────────── */
    /* Below 1190px Glance shows ONE column at a time behind swipe pills — that is iPad
       portrait and most iPads in landscape. Wide enough for everything at once, so lay the
       columns out as a grid instead: services across the top, the two side columns
       beneath them side by side. Phones keep Glance's own single-column layout. */
    @media (min-width: 700px) and (max-width: 1190px) {
      .page-columns {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        align-items: start;
      }

      .page-columns > .page-column {
        display: block !important;
        width: auto !important;
        min-width: 0;
      }

      .page-columns > .page-column-full {
        grid-column: 1 / -1;
        order: -1;
      }

      /* A page with a single small column gives it the whole row. */
      .page-columns:not(:has(> .page-column-small ~ .page-column-small)) > .page-column-small {
        grid-column: 1 / -1;
      }

      /* The column pills have nothing left to switch; the page menu stays. */
      .mobile-navigation-label {
        display: none !important;
      }
    }
