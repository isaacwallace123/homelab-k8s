# API credentials for the dashboard's widgets, read by the Deployment through envFrom — so
# each key here becomes ${KEY} in the Glance config: PLEX_TOKEN, RADARR_KEY, SONARR_KEY,
# PROWLARR_KEY, OVERSEERR_KEY, SAB_KEY, QB_PASS, GRAFANA_PASS.
#
# Resealed from homepage-secrets when the component was renamed: a SealedSecret is encrypted
# against its own name AND namespace, so the old ciphertext could not simply be relabelled.
# Sealed against the 2026-09-04 controller key (the newest at the time), which expires 2036.
#
# To rotate one of these, re-seal the whole Secret — kubeseal encrypts values individually,
# but the file is written whole:
#
#   # the controller's newest public cert — public data, safe to handle
#   kubectl -n secrets get secret -l sealedsecrets.bitnami.com/sealed-secrets-key \
#     --sort-by=.metadata.creationTimestamp \
#     -o jsonpath='{.items[-1].data.tls\.crt}' | base64 -d > /tmp/pub.crt
#
#   # edit the live Secret first, then re-seal it under the same name
#   kubectl -n networking get secret glance-secrets -o json \
#     | jq '{apiVersion, kind, type, metadata: {name, namespace}, data}' \
#     | kubeseal --cert /tmp/pub.crt --format yaml > sealed-secret.yaml
#
# --cert rather than a live controller lookup: kubeseal's default path proxies through the
# API server to the controller Service, which answers 502 here.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: glance-secrets
  namespace: networking
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  encryptedData:
    GRAFANA_PASS: 
    OVERSEERR_KEY: 
    PLEX_TOKEN: 
    PROWLARR_KEY: 
    QB_PASS: 
    RADARR_KEY: 
    SAB_KEY: 
    SONARR_KEY: 
  template:
    metadata:
      name: glance-secrets
      namespace: networking
    type: Opaque
