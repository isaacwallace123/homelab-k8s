# wger configuration.
#
# Upstream ships this as a single config/prod.env consumed by every container via
# `env_file`. That maps cleanly onto one ConfigMap shared by web, both celery containers
# and PowerSync — so the settings stay in one readable place rather than being duplicated
# into four container specs.
#
# Secrets are NOT here. SECRET_KEY and the JWT keypair come from the sealed secret; the
# database password comes from CNPG's generated `wger-pg-app` Secret. Nothing in this file
# is confidential.
#
# Nothing in here needs editing to deploy. The hostname is fitness.isaacwallace.dev in three
# places (SITE_URL, CSRF_TRUSTED_ORIGINS, and the HTTPRoute in routes.yaml); changing the
# hostname later means changing all three plus the Cloudflare Tunnel's public hostname, and
# re-warming the exercise API cache — see the component README.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wger-config
  namespace: fitness
data:
  # ── Canonical host ──────────────────────────────────────────────────────────────────
  # The public hostname, and it must be the public one: this value is baked into the
  # absolute image and media URLs the REST API hands to the iOS app. Point it at the LAN
  # address instead and the web UI works fine while every exercise image in the app breaks
  # the moment the phone leaves the house.
  #
  # http://192.168.0.246 still serves the site on the LAN, and is trusted for CSRF below —
  # it just is not the name the API advertises.
  SITE_URL: "https://fitness.isaacwallace.dev"

  # Django rejects any POST whose Origin is not listed here, which includes every login.
  # Both names, so the web UI works whether you come in over the internet or the LAN.
  CSRF_TRUSTED_ORIGINS: "https://fitness.isaacwallace.dev,http://192.168.0.246"

  # TLS is terminated by Cloudflare, so every request reaches this pod as plain HTTP. Without
  # these two, Django sees http://, builds http:// redirects for an https:// site, and the
  # login POST bounces between schemes until the browser gives up.
  X_FORWARDED_PROTO_HEADER_SET: "True"
  USE_X_FORWARDED_HOST: "True"

  # Proxies that append to X-Forwarded-For before gunicorn sees it: cloudflared, the Envoy
  # edge gateway, then nginx in this pod. Upstream defaults to 1 because compose has only
  # nginx.
  #
  # This is not cosmetic. It decides which entry of X-Forwarded-For is treated as the client,
  # and that address is what API throttling buckets by and what django-axes locks out. Too
  # low and every request looks like it came from Envoy — so one person tripping the lockout
  # locks out everyone. Verify after the first real request:
  #   kubectl logs -n fitness deploy/wger -c nginx | tail -1
  # and count the addresses in the forwarded chain.
  NUMBER_OF_PROXIES: "3"

  TIME_ZONE: "America/Toronto"
  TZ: "America/Toronto"

  # ── Accounts ────────────────────────────────────────────────────────────────────────
  # Off, and this one matters more than usual: the site is publicly reachable, so left at
  # upstream's default True the login page is also an open sign-up form on the internet for
  # an instance holding body measurements and progress photos. Both accounts are created by
  # hand — see the component README.
  ALLOW_REGISTRATION: "False"
  ALLOW_GUEST_USERS: "False"
  ALLOW_UPLOAD_VIDEOS: "True"
  USE_RECAPTCHA: "False"

  # ── Brute-force lockout (django-axes) ───────────────────────────────────────────────
  # Load-bearing, not belt-and-braces. This login form is on the public internet with no
  # Cloudflare Access in front of it, so this lockout and the account passwords are the
  # entire boundary. 10 failures per IP, then 30 minutes of refusal.
  AXES_ENABLED: "True"
  AXES_FAILURE_LIMIT: "10"
  AXES_COOLOFF_TIME: "30"
  AXES_HANDLER: "axes.handlers.cache.AxesCacheHandler"
  AXES_LOCKOUT_PARAMETERS: "ip_address"
  AXES_IPWARE_PROXY_COUNT: "3"
  AXES_IPWARE_META_PRECEDENCE_ORDER: "HTTP_X_FORWARDED_FOR,REMOTE_ADDR"

  # ── Exercise / ingredient sync ──────────────────────────────────────────────────────
  # The exercise database is synced from wger.de rather than typed in. Images yes, videos
  # NO: the video set is the single largest thing this app will ever download and it would
  # dominate a 20Gi media volume for two users who came here to log sets. Flip
  # SYNC_EXERCISE_VIDEOS_CELERY to True and grow the PVC if you want them.
  WGER_INSTANCE: "https://wger.de"
  SYNC_EXERCISES_CELERY: "True"
  SYNC_EXERCISE_IMAGES_CELERY: "True"
  SYNC_EXERCISE_VIDEOS_CELERY: "False"
  SYNC_INGREDIENTS_CELERY: "True"
  SYNC_INGREDIENTS_DUMP_URL: "https://wger.de/media/ingredients/ingredients.jsonl.gz"
  DOWNLOAD_INGREDIENTS_FROM: "WGER"
  MIN_ACCOUNT_AGE_TO_TRUST: "21"

  # Deliberately False. These run the sync inline during container startup, so the pod
  # stays unready for as long as the download takes and Kubernetes eventually restarts it
  # mid-sync — a boot loop that looks like a broken image. Celery does the same work in the
  # background, after the app is already serving.
  SYNC_EXERCISES_ON_STARTUP: "False"
  DOWNLOAD_EXERCISE_IMAGES_ON_STARTUP: "False"

  # ── Celery ──────────────────────────────────────────────────────────────────────────
  USE_CELERY: "True"
  CELERY_BROKER: "redis://wger-redis:6379/2"
  CELERY_BACKEND: "redis://wger-redis:6379/2"
  # 4 upstream. Two users and a handful of weekly sync jobs do not need four prefork
  # children each holding a Django process in memory on a shared node.
  CELERY_WORKER_CONCURRENCY: "2"
  CACHE_API_EXERCISES_CELERY: "True"
  CACHE_API_EXERCISES_CELERY_FORCE_UPDATE: "True"

  # ── Cache ───────────────────────────────────────────────────────────────────────────
  DJANGO_CACHE_BACKEND: "django_redis.cache.RedisCache"
  DJANGO_CACHE_LOCATION: "redis://wger-redis:6379/1"
  DJANGO_CACHE_TIMEOUT: "1296000"
  DJANGO_CACHE_CLIENT_CLASS: "django_redis.client.DefaultClient"
  EXERCISE_CACHE_TTL: "2419200"

  # ── PowerSync ───────────────────────────────────────────────────────────────────────
  # `ps` matches the /ps/ location block in the nginx config. The iOS app derives its sync
  # endpoint from SITE_URL + this path, so the two must agree — which is the second reason
  # SITE_URL has to be the public hostname.
  POWERSYNC_URL_PATH: "ps"
  PS_PORT: "8080"
  # PowerSync verifies the app's JWTs against a JWKS the wger server publishes. 127.0.0.1
  # because PowerSync runs as a container in the wger pod — see the note in wger.yaml.
  PS_JWKS_URL: "http://127.0.0.1:8000/api/v2/powersync-keys"
  #
  # PS_DATABASE_URI and PS_STORAGE_PG_URI are NOT here: they embed the Postgres password,
  # so they are assembled in the PowerSync container's own env block from CNPG's generated
  # Secret. See wger.yaml.

  # ── Runtime ─────────────────────────────────────────────────────────────────────────
  DJANGO_DEBUG: "False"
  # False, and this is not a typo. The db-bootstrap initContainer runs `migrate` once,
  # before any container serves. Left True, `web` would migrate again on every start — and
  # more to the point, a concurrent migration is a real way to end up with a half-applied
  # schema. See the initContainer comment in wger.yaml.
  DJANGO_PERFORM_MIGRATIONS: "False"
  DJANGO_COLLECTSTATIC_ON_STARTUP: "True"
  DJANGO_CLEAR_STATIC_FIRST: "False"
  WGER_USE_GUNICORN: "True"
  WGER_PORT: "8000"
  LOG_LEVEL_PYTHON: "INFO"
  # 3 workers x 2 threads upstream. Halved: two users, and this shares a node with Immich's
  # CPU-bound ML.
  GUNICORN_CMD_ARGS: "--workers 2 --threads 2 --worker-class gthread --timeout 240"
  EXPOSE_PROMETHEUS_METRICS: "False"
  ACCESS_TOKEN_LIFETIME: "10"
  REFRESH_TOKEN_LIFETIME: "2880"
  FROM_EMAIL: "wger <wger@isaacwallace.dev>"
---
# nginx. Upstream is emphatic that this is not optional: the `web` container serves the
# application but NOT its static files, so dropping nginx gives a working site with no CSS
# and a React bundle that 404s.
#
# Taken from upstream config/nginx.conf with three changes, each forced by running in a pod
# rather than under compose:
#
#   1. Upstreams are 127.0.0.1, not `web` and `powersync`. All three containers share this
#      pod's network namespace, so they reach each other on localhost. This also removes
#      nginx's startup dependency on DNS resolving a sibling service.
#   2. `resolver` is unnecessary for the same reason.
#   3. The JSON access log format is kept verbatim — it matches the field names the
#      Loki/Alloy parser already expects, so the existing dashboard works with no changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wger-nginx
  namespace: fitness
data:
  default.conf: |
    upstream wger {
        server 127.0.0.1:8000;
    }

    upstream powersync {
        server 127.0.0.1:8080;
    }

    log_format json_access escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"client_ip":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"request_proto":"$server_protocol",'
            '"request_host":"$host",'
            '"status":$status,'
            '"size":$body_bytes_sent,'
            '"duration":$request_time,'
            '"user_agent":"$http_user_agent",'
            '"referer":"$http_referer"'
        '}';

    map $http_x_forwarded_proto $final_forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    server {
        listen 80;

        access_log /dev/stdout json_access;

        location / {
            proxy_pass http://wger;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $final_forwarded_proto;
            proxy_set_header X-Forwarded-Host $http_host;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect off;
            proxy_http_version 1.1;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # PowerSync, used by the mobile app for offline mode. Sync streams are long-lived
        # streaming POSTs: buffering them or applying a normal timeout breaks sync in a way
        # that looks like the app silently not updating.
        location /ps/ {
            proxy_pass http://powersync/;

            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $final_forwarded_proto;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_buffering off;
            proxy_read_timeout 1d;
            proxy_send_timeout 1d;

            add_header X-Accel-Buffering no always;
        }

        location /static/ {
            alias /wger/static/;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Vary "Accept-Encoding" always;
        }

        location /media/ {
            alias /wger/media/;
        }

        # Video uploads.
        client_max_body_size 100M;
    }
