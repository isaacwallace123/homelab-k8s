# Vaultwarden — Bitwarden-compatible password manager.
#
# SQLite on a Longhorn volume, not CloudNativePG. This is the one service in the cloud
# tier that should have the fewest moving parts between you and your credentials: if the
# cluster is unhealthy enough that Postgres will not start, you still want to be able to
# read your passwords. A single file on a replicated volume is easier to restore by hand
# than a database.
#
# Backed up by the `default` Longhorn recurring group, so it lands in Garage weekly along
# with everything else.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: cloud
  labels:
    app: vaultwarden
spec:
  replicas: 1
  # Recreate: SQLite on RWO. Two pods would corrupt it, and a rolling update would try.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      nodeSelector:
        homelab.isaacwallace.dev/pool: cloud
      tolerations:
        - key: homelab.isaacwallace.dev/pool
          operator: Equal
          value: cloud
          effect: NoSchedule
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.34.1-alpine
          env:
            # Must match the URL the browser actually uses. Vaultwarden builds its API
            # and WebSocket URLs from this, so an https:// value while being reached over
            # http:// on the LAN leaves the web vault spinning forever on a blocked
            # request. Change this when it goes behind the tunnel with real TLS.
            - name: DOMAIN
              value: http://192.168.0.246
            # Signups off. This is a personal vault; leaving it open means anyone who
            # reaches the LAN address can create an account on it.
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vaultwarden-auth
                  key: admin-token
                  optional: true
            - name: ROCKET_PORT
              value: "8080"
          ports:
            - containerPort: 8080
              name: http
          startupProbe:
            httpGet:
              path: /alive
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /alive
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /alive
              port: 8080
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: cloud
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: cloud
  annotations:
    metallb.io/loadBalancerIPs: "192.168.0.246"
spec:
  type: LoadBalancer
  selector:
    app: vaultwarden
  ports:
    - port: 80
      targetPort: 8080
      name: http
