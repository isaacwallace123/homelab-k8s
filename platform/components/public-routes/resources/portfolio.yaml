---
# cyberlab is the read-only public website only. The range itself — attacker, victim, SOC
# and scenario VMs — lives on Proxmox and never runs in this cluster, so there is nothing
# here that routing could reach even by mistake.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cyberlab
  namespace: cyberlab
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: networking
      sectionName: http
  hostnames:
    - cyberlab.isaacwallace.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: cyberlab-web
          port: 80
          weight: 1
