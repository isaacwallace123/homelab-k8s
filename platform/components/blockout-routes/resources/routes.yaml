# Public HTTPRoutes for Blockout Games (blockoutgames.com).
#
# The workloads are owned by the private BlockoutGames/Platform monorepo; whether they are
# reachable from the internet is decided here, as for the portfolio network. Both hostnames
# attach to `edge` (.204), which the Cloudflare tunnel reaches over plain HTTP. The
# `blockout` namespace carries `exposure: public`, which is what lets these attach.
#
# ── THE CLOUDFLARE SIDE ───────────────────────────────────────────────────────────────────
# blockoutgames.com is a second zone on the same Cloudflare account as the tunnel. The
# tunnel needs public hostnames for the apex, www, studio, docs and status, all → http://192.168.0.204.
# A wildcard *.blockoutgames.com covers www, studio, docs and status; the apex still needs its own entry,
# because a wildcard matches one label, not zero. Cloudflare terminates TLS; the tunnel is
# plain HTTP; Envoy matches the hostname and 404s anything not listed here.
#
# ── WHAT IS NOT ROUTED ───────────────────────────────────────────────────────────────────
# Only www, the panel, the docs and the status app. The API, worker, Postgres and Redis have
# no route, and the namespace's NetworkPolicies admit the gateway to ports 3000 to 3003 only. The panel
# enforces GitHub organization membership on every request. Cloudflare Access in front of
# studio.blockoutgames.com would be a second lock; it is optional, and unlike openGym's
# WebAuthn the GitHub OAuth flow works through it.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www
  namespace: blockout
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: networking
      sectionName: http
  hostnames:
    - blockoutgames.com
    - www.blockoutgames.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: www
          port: 3001
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: studio
  namespace: blockout
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: networking
      sectionName: http
  hostnames:
    - studio.blockoutgames.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: panel
          port: 3000
          weight: 1
---
# The public docs and API reference: the Platform's `docs` app (ADR-0058 there).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: docs
  namespace: blockout
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: networking
      sectionName: http
  hostnames:
    - docs.blockoutgames.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: docs
          port: 3002
          weight: 1
---
# The status page: the Platform's own `status` app (styled like the studio panel), which reads
# Gatus (components/gatus) and the platform's status inside the cluster. A new object name
# (`status-site`): the app's ignoreDifferences on .spec.rules[].matches, with
# RespectIgnoreDifferences, keeps an existing route's rules as they are live, so a route's rules
# are changed by replacing the route, not by editing it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: status-site
  namespace: blockout
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: networking
      sectionName: http
  hostnames:
    - status.blockoutgames.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: status
          port: 3003
          weight: 1
