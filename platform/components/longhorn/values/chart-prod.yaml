# Longhorn.
#
# defaultReplicaCount is 2 rather than 3 because until migration phase 2 every node is a VM
# on pve2 — a third replica bought nothing but disk. Once the cluster spans both Proxmox
# hosts and nodes carry topology.kubernetes.io/zone, the zone-aware replicated class in
# resources/ is what provides real cross-host redundancy.
#
# THE DEFAULT STORAGE CLASS is `longhorn-replicated`, declared in resources/. This chart
# must not also claim it: with `persistence.defaultClass: true` the cluster ended up with
# THREE classes marked default (local-path, longhorn, longhorn-replicated), and Kubernetes
# resolves that arbitrarily.
#
# The plain `longhorn` class still exists and the 12 PVCs already bound to it are
# unaffected — it is simply no longer the one an unqualified PVC lands on.
defaultSettings:
  defaultReplicaCount: 2
  defaultDataPath: /var/lib/longhorn
  # Spread replicas across physical hosts once zone labels exist (phase 3).
  replicaZoneSoftAntiAffinity: true
  replicaAutoBalance: best-effort

  # Rebuild ONE replica per node at a time, not the default five.
  #
  # etcd lives on the same pve2 storage as everything else, and it is exquisitely sensitive
  # to fsync latency. Nine concurrent rebuilds drove pve2 to loadavg 16 with 22% iowait,
  # which starved etcd, cost it its leader-election leases, and dropped the API server
  # twice. Rebuilds are background work; the control plane is not.
  concurrentReplicaRebuildPerNodeLimit: 1

# Longhorn must tolerate the media taint. The media node holds replicas like every other
# worker, and without this toleration its manager and CSI driver cannot schedule there --
# which shows up as a disk that never becomes Schedulable rather than as an obvious error.
longhornManager:
  nodeSelector:
    node-role.kubernetes.io/worker: "true"
  tolerations: &mediaToleration
    - key: homelab.isaacwallace.dev/workload
      operator: Equal
      value: media
      effect: NoSchedule
longhornDriver:
  nodeSelector:
    node-role.kubernetes.io/worker: "true"
  tolerations: *mediaToleration
longhornUI:
  nodeSelector:
    node-role.kubernetes.io/worker: "true"
  tolerations: []

persistence:
  defaultClass: false
  defaultClassReplicaCount: 2

ingress:
  enabled: false
