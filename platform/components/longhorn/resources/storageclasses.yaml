# =============================================================================
# Storage tiers — see docs/architecture/storage.md
#
# Exactly ONE class is default. Previously both local-path and longhorn carried the
# default annotation, which makes an unqualified PVC land on either one arbitrarily.
# Clearing local-path's annotation is a phase-3 step (it ships with k3s, not from here):
#
#   kubectl patch storageclass local-path -p \
#     '{"metadata":{"annotations":{"storageclass.kubernetes.io/is-default-class":"false"}}}'
# =============================================================================
---
# Survives losing a whole Proxmox host. Databases, ArgoCD, Grafana, Nextcloud.
#
# The zone soft anti-affinity is what makes the second host worth having: with
# topology.kubernetes.io/zone set to the physical Proxmox host, three replicas are placed
# across both machines. Before the cluster spanned two hosts, "3 replicas" meant three
# copies on one physical box.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-replicated
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3"
  staleReplicaTimeout: "30"
  fsType: ext4
  # These take enabled/disabled/ignored, NOT booleans. With "true"/"false" the CSI
  # provisioner rejects every request -- "invalid ReplicaSoftAntiAffinity setting: false" --
  # so this class has never successfully provisioned a volume despite being the default.
  # Every existing PVC quietly landed on the plain `longhorn` class instead.
  #
  #   disabled = strict: never put two replicas of a volume on one node (the intent of "false")
  #   enabled  = soft:   prefer spreading across zones but allow it (the intent of "true")
  replicaZoneSoftAntiAffinity: "enabled"
  replicaSoftAntiAffinity: "disabled"
  dataLocality: best-effort
---
# One replica. Rebuildable caches and scratch that still wants Longhorn snapshots.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "1"
  staleReplicaTimeout: "30"
  fsType: ext4
  dataLocality: strict-local
