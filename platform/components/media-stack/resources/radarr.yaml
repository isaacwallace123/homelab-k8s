# ── radarr ────────────────────────────────────────────────────────────────────
# Its own Deployment. Restarting Radarr no longer restarts the VPN tunnel, the download
# clients, or Sonarr — which is the practical benefit of the split.
#
# Radarr never contacts a tracker directly: it asks Prowlarr for releases and hands the
# result to qBittorrent/SABnzbd, both of which are inside the tunnel. So it does not need
# to be there itself.
#
# Stays on the media pool with the rest of the stack. /movies and /downloads are RWX NFS
# and would mount anywhere, but co-location keeps every config PVC (RWO Longhorn) on one
# node, which is what lets media-bootstrap read them all.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: media
  labels:
    app: radarr
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
        app.kubernetes.io/part-of: media-stack
    spec:
      nodeSelector:
        homelab.isaacwallace.dev/pool: media
      tolerations:
        - key: homelab.isaacwallace.dev/pool
          operator: Equal
          value: media
          effect: NoSchedule
        - key: homelab.isaacwallace.dev/workload
          operator: Equal
          value: media
          effect: NoSchedule
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:6.3.0.10514-ls311
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 7878
              name: radarr-ui
          startupProbe:
            tcpSocket:
              port: 7878
            initialDelaySeconds: 45
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 7878
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config-radarr
              mountPath: /config
            - name: movies
              mountPath: /movies
            # Same mount path as the download clients use, so Radarr's completed-download
            # handling can hardlink instead of copying across filesystems.
            - name: downloads
              mountPath: /downloads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config-radarr
          persistentVolumeClaim:
            claimName: config-radarr
        - name: movies
          persistentVolumeClaim:
            claimName: tank-movies
        - name: downloads
          persistentVolumeClaim:
            claimName: nvme-downloads
