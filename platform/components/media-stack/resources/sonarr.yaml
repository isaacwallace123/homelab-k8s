# ── sonarr ────────────────────────────────────────────────────────────────────
# Radarr's counterpart for TV. Same reasoning: it talks to Prowlarr and the download
# clients, never to a tracker, so it lives outside the tunnel with its own restart domain.
# See radarr.yaml for the full rationale.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: media
  labels:
    app: sonarr
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
        app.kubernetes.io/part-of: media-stack
    spec:
      nodeSelector:
        homelab.isaacwallace.dev/pool: media
      tolerations:
        - key: homelab.isaacwallace.dev/pool
          operator: Equal
          value: media
          effect: NoSchedule
        - key: homelab.isaacwallace.dev/workload
          operator: Equal
          value: media
          effect: NoSchedule
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls320
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/New_York
          ports:
            - containerPort: 8989
              name: sonarr-ui
          startupProbe:
            tcpSocket:
              port: 8989
            initialDelaySeconds: 45
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: 8989
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 8989
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config-sonarr
              mountPath: /config
            - name: tv
              mountPath: /tv
            - name: downloads
              mountPath: /downloads
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config-sonarr
          persistentVolumeClaim:
            claimName: config-sonarr
        - name: tv
          persistentVolumeClaim:
            claimName: tank-tv
        - name: downloads
          persistentVolumeClaim:
            claimName: nvme-downloads
