# The BlockoutGames runner scale set (gha-runner-scale-set). Jobs in any BlockoutGames
# repository whose `runs-on` is `blockout` run here: each in a fresh pod, created when the job
# is queued and deleted when it ends, so nothing from one job reaches the next. With no jobs
# waiting there are no runner pods at all.
#
# The repositories pick this up through the Actions variable RUNS_ON = "blockout" (see the
# Anime Clicker Heroes vault, "CI runner"). Unset it there to send jobs back to GitHub.

githubConfigUrl: https://github.com/BlockoutGames

# A GitHub App installed on the organisation, with "Self-hosted runners: Read and write".
# Sealed into this namespace by pre-resources/ (create-sealed-github-app.sh).
githubConfigSecret: arc-github-app

# What workflows put in `runs-on`.
runnerScaleSetName: blockout

minRunners: 0
maxRunners: 4

# The controller from the arc-controller component: its release (and so its ServiceAccount)
# is named after the ArgoCD Application.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

template:
  spec:
    # The apps pool first, the cloud pool when apps is full. The apps pool is mostly reserved
    # (the Minecraft server alone asks for 4 cores and 14 GiB of k8s-work-02), and a CI job is a
    # few bursty minutes, so it may borrow the cloud node's spare room; it never lands on the
    # media or control-plane nodes.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: homelab.isaacwallace.dev/pool
                  operator: In
                  values: [apps, cloud]
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: homelab.isaacwallace.dev/pool
                  operator: In
                  values: [apps]
    tolerations:
      - key: homelab.isaacwallace.dev/pool
        operator: Equal
        value: cloud
        effect: NoSchedule
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        command: ["/home/runner/run.sh"]
        # A small reservation so a job finds room; it may burst to the limit while it builds.
        resources:
          requests:
            cpu: 250m
            memory: 768Mi
          limits:
            cpu: "2"
            memory: 4Gi
