# The BlockoutGames runner scale set (gha-runner-scale-set). Jobs in any BlockoutGames
# repository whose `runs-on` is `blockout` run here: each in a fresh pod, created when the job
# is queued and deleted when it ends, so nothing from one job reaches the next. With no jobs
# waiting there are no runner pods at all.
#
# The repositories pick this up through the Actions variable RUNS_ON = "blockout" (see the
# Anime Clicker Heroes vault, "CI runner"). Unset it there to send jobs back to GitHub.

githubConfigUrl: https://github.com/BlockoutGames

# A GitHub App installed on the organisation, with "Self-hosted runners: Read and write".
# Sealed into this namespace by pre-resources/ (create-sealed-github-app.sh).
githubConfigSecret: arc-github-app

# What workflows put in `runs-on`.
runnerScaleSetName: blockout

minRunners: 0
maxRunners: 5  # k8s-ci-01 (12 cores, 28 GiB) fits five of each: ten runners at once

# The controller from the arc-controller component: its release (and so its ServiceAccount)
# is named after the ArgoCD Application.
controllerServiceAccount:
  namespace: arc-systems
  name: arc-controller-gha-rs-controller

template:
  spec:
    # The ci pool only (k8s-ci-01 on cyberlab), never the blockout workers: a job runs code from
    # pull requests and dependency updates, and must not share a kernel, a kubelet credential or
    # a Longhorn disk with Blockout's database and secrets. A job that finds no room waits in
    # GitHub's queue.
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: homelab.isaacwallace.dev/pool
                  operator: In
                  values: [ci]
    tolerations:
      - key: homelab.isaacwallace.dev/pool
        operator: Equal
        value: ci
        effect: NoSchedule
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:latest
        # GitHub's machines come with the GitHub CLI and many workflows call `gh`; this image
        # has none, so the runner fetches the current release before it takes its job. The
        # release is found through the /latest redirect rather than the API, which would rate
        # limit a busy hour of pods. A failed fetch still starts the runner.
        command: ["/bin/bash", "-c"]
        args:
          - |
            if ! command -v gh > /dev/null; then
              tag=$(curl -fsSIL -o /dev/null -w '%{url_effective}' https://github.com/cli/cli/releases/latest)
              tag=${tag##*/}
              curl -fsSL "https://github.com/cli/cli/releases/download/${tag}/gh_${tag#v}_linux_amd64.tar.gz" |
                sudo tar -xz -C /usr/local --strip-components=1 ||
                echo "Could not install the GitHub CLI; jobs that call gh will fail."
            fi
            exec /home/runner/run.sh
        # A real reservation: a build or test run keeps about a core busy. With a token one,
        # a burst of queued jobs piled onto one node and starved each other past their
        # timeouts; now a job that finds no room waits in GitHub's queue, whose clock has
        # not started, until a pod frees one. It may still burst to the limit.
        resources:
          # Each job may burst to 4 CPUs; k8s-ci-01 holds the plain and Docker jobs together
          # (6 x 1 CPU here, 6 x 1.5 CPU there, requested); the rest wait in GitHub's queue.
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            cpu: "4"
            memory: 8Gi
