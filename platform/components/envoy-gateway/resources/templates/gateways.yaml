apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClassName }}
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
{{/*
One Gateway per entry in .Values.gateways, each on its own MetalLB address.

Splitting these matters for more than tidiness: a single Gateway mixing tunnel-facing HTTP
with LAN-only TLS means one mis-scoped HTTPRoute can publish an internal service through
the public tunnel. Separate Gateways with separate allowedRoutes make that structurally
impossible rather than a thing to catch in review.

NOTE: raw TCP/UDP workloads do not pass through a Gateway. Envoy proxies TCP/UDP in
non-transparent mode only, so the backend would see Envoy's address instead of the
client's — which breaks IP bans and per-client rate limiting. Such Services take a
MetalLB address directly.
*/}}
{{- range $gw := .Values.gateways }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ $gw.name }}
  namespace: {{ $.Values.namespace }}
  {{- with $gw.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ $.Values.gatewayClassName }}
  infrastructure:
    annotations:
      metallb.io/address-pool: {{ $gw.pool }}
      metallb.io/loadBalancerIPs: {{ $gw.address | quote }}
    {{- if $gw.replicas }}
    {{/* Envoy Gateway reads deployment shape from an EnvoyProxy resource, not from the
         Gateway itself -- there is no replicas field here to set. The EnvoyProxy is
         rendered below and referenced by name. */}}
    {{/* LocalParametersReference: group/kind/name only. It carries no namespace field --
         the EnvoyProxy is resolved in the Gateway's own namespace, which is where the
         resource below is created. Including `namespace` here is schema-invalid and
         ArgoCD reports it as a ComparisonError rather than a sync failure, so the app
         stays "Healthy" while silently never applying. */}}
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: {{ $gw.name }}-proxy
    {{- end }}
  listeners:
    {{- range $l := $gw.listeners }}
    - name: {{ $l.name }}
      protocol: {{ $l.protocol }}
      port: {{ $l.port }}
      {{- with $l.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      {{- if $l.tls }}
      tls:
        mode: {{ $l.tls.mode }}
        {{- if eq $l.tls.mode "Terminate" }}
        certificateRefs:
          - group: ""
            kind: Secret
            name: {{ $l.tls.secretName }}
            namespace: {{ $.Values.namespace }}
        {{- end }}
      {{- end }}
      allowedRoutes:
        namespaces:
          {{- if $l.allowedNamespaces }}
          from: Selector
          selector:
            matchLabels:
              {{- toYaml $l.allowedNamespaces | nindent 14 }}
          {{- else }}
          from: All
          {{- end }}
    {{- end }}
{{- end }}

{{/*
Deployment shape for each Gateway's Envoy fleet.

Only rendered for gateways declaring `replicas`. A Gateway carrying public traffic must not
be a single pod: the whole point of moving every public hostname behind `edge` is that one
origin serves them all, which also means one Envoy failure takes all of them down at once.
Anti-affinity spreads the replicas across nodes so a single node reboot cannot do it.
*/}}
{{- range $gw := .Values.gateways }}
{{- if $gw.replicas }}
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ $gw.name }}-proxy
  namespace: {{ $.Values.namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: {{ $gw.replicas }}
        pod:
          affinity:
            podAntiAffinity:
              # preferred, not required: with replicas > node count the required form would
              # leave pods permanently Pending rather than merely co-located.
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        gateway.envoyproxy.io/owning-gateway-name: {{ $gw.name }}
                        gateway.envoyproxy.io/owning-gateway-namespace: {{ $.Values.namespace }}
{{- end }}
{{- end }}
