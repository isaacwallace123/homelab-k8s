# Nextcloud — files, calendar, contacts.
#
# STORAGE: split. The application tree is on Longhorn; only user DATA is on TrueNAS NFS.
#
# Putting all of /var/www/html on NFS does not work. On every start the image rsyncs its
# ~30,000-file tree into that directory, and the aws-sdk-php vendor bundle alone is ~15,000
# tiny files. Over NFS each one costs a round trip; the rsync wedged in
# `rpc_wait_bit_killable` and made zero progress for minutes at a time. Large sequential
# media reads from the same server are unaffected — this is a small-file problem, not a
# broken NFS server.
#
# So the app tree lives on Longhorn (fast, local, real POSIX semantics) and /var/www/html/data
# — the part that actually grows and that you want on the NAS — is the NFS dataset. This is
# also the layout Nextcloud itself recommends.
#
# NOT Garage S3 primary storage, deliberately: with S3 primary storage Nextcloud writes
# every file as an opaque object keyed by file ID, so you cannot browse your own data on the
# NAS and recovering one file means resolving IDs through the database. On a box that
# already has ZFS snapshots, a plain directory is far easier to get files out of.
#
# DATABASE: a Crossplane `Database` claim, not a hand-rolled Postgres. See
# platform/components/platform-api/resources/database-xrd.yaml.
apiVersion: platform.homelab.isaacwallace.dev/v1alpha1
kind: Database
metadata:
  name: nextcloud
spec:
  # Cluster-scoped composite; the namespace is a field. See database-xrd.yaml.
  namespace: cloud
  databaseName: nextcloud
  size: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
  namespace: cloud
  labels:
    app: nextcloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      nodeSelector:
        homelab.isaacwallace.dev/pool: cloud
      tolerations:
        - key: homelab.isaacwallace.dev/pool
          operator: Equal
          value: cloud
          effect: NoSchedule
      securityContext:
        fsGroup: 33          # www-data
      containers:
        - name: nextcloud
          image: nextcloud:31.0.5-apache
          env:
            - name: POSTGRES_HOST
              valueFrom:
                secretKeyRef:
                  name: nextcloud-pg-app     # published as status.secretName by the claim
                  key: host
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: nextcloud-pg-app
                  key: dbname
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-pg-app
                  key: user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-pg-app
                  key: password
            - name: NEXTCLOUD_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: nextcloud-auth
                  key: admin-user
                  optional: true
            - name: NEXTCLOUD_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nextcloud-auth
                  key: admin-password
                  optional: true
            # localhost and the pod CIDR are NOT optional here. The kubelet sends its
            # probes with Host set to the POD IP, and Nextcloud answers any untrusted host
            # with HTTP 400 {"error":"Trusted domain error.","code":15}. The readiness
            # probe then never passes and the LIVENESS probe kills the pod -- which looks
            # exactly like "Nextcloud crashed when I created the admin account".
            - name: NEXTCLOUD_TRUSTED_DOMAINS
              value: "cloud.isaacwallace.dev 192.168.0.243 localhost 10.42.*.*"
            # Behind cloudflared, so the app must trust the proxy's forwarded headers or
            # every login appears to come from the tunnel's pod IP and rate limiting fires.
            - name: TRUSTED_PROXIES
              value: "10.42.0.0/16"
            - name: OVERWRITEPROTOCOL
              value: https
          ports:
            - containerPort: 80
              name: http
          startupProbe:
            httpGet:
              path: /status.php
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            # 30s + 180*10s = ~30 minutes.
            #
            # First boot does not just run the installer: it unpacks the entire Nextcloud
            # tree -- tens of thousands of small files -- onto the NFS dataset. Over NFS
            # that is far slower than the local-disk case the default assumes. At the
            # previous 10-minute budget the probe killed the pod mid-extraction and it
            # restarted from the beginning, which looks identical to a crash loop.
            failureThreshold: 180
          readinessProbe:
            httpGet:
              path: /status.php
              port: 80
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /status.php
              port: 80
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            # App tree on Longhorn — this is what rsync writes on every start.
            - name: html
              mountPath: /var/www/html
            # User data on the NAS, mounted INSIDE the app tree.
            - name: data
              mountPath: /var/www/html/data
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: nextcloud-html
        - name: data
          persistentVolumeClaim:
            claimName: tank-cloud-nextcloud
---
# The Nextcloud application tree. Longhorn, not NFS — see the note at the top of this file.
# ~2 GiB unpacked; 10 GiB leaves room for apps installed later.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nextcloud-html
  namespace: cloud
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn-replicated
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
  namespace: cloud
  annotations:
    metallb.io/loadBalancerIPs: "192.168.0.243"
spec:
  type: LoadBalancer
  selector:
    app: nextcloud
  ports:
    - port: 80
      targetPort: 80
      name: http
