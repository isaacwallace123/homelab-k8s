# Actions Runner Controller (GitHub's gha-runner-scale-set-controller).
#
# The controller watches AutoscalingRunnerSet resources (one per runner scale set, see
# arc-runners) and, when GitHub has jobs waiting, creates an ephemeral runner pod for each.
# It holds no state and runs no jobs itself, so it sits on the general-purpose pool like the
# other operators.
nodeSelector:
  homelab.isaacwallace.dev/pool: apps

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

# Scale sets live in arc-runners; the controller manages only namespaces that hold one.
flags:
  logLevel: info
  # ArgoCD tracks resources by the label argocd.argoproj.io/instance. The controller copies a
  # scale set's labels onto the listener, Role and RoleBinding it creates, so ArgoCD claimed
  # them for the arc-runners Application, found them missing from git and pruned them: the
  # listener lived a few seconds at a time. Not copying that label leaves them the controller's.
  excludeLabelPropagationPrefixes:
    - "argocd.argoproj.io/instance"
