# MetalLB address plan — see docs/architecture/networking.md §1.
#
# Router DHCP MUST end at .200. Everything below is static or MetalLB-owned.
#
#   .10 – .19   k8s nodes (static, cloud-init)
#   .201 – .209 platform-pool   pinned    gateways, ArgoCD
#   .210 – .219 (free)          —         reclaimed from the retired game fleet
#   .220 – .250 services-pool   pinned    dashboards, media, monitoring, cloud
#
# ALLOCATED (check this before pinning a new address — the pool is pinned, so a duplicate
# request silently stays <pending> forever with no event explaining why):
#   .220 homepage      .222 ntfy        .226 minecraft-valhelsia
#   .230 plex          .231 radarr      .232 sonarr     .233 prowlarr
#   .234 qbittorrent   .235 sabnzbd     .236 overseerr
#   .240 grafana       .241 prometheus  .242 alertmanager
#   .244 immich        .245 garage-s3   .247 stirling-pdf
# Free: .223-.225, .227-.229, .237-.239, .243, .246, .248-.250
#
# DO NOT USE .221 — a cyberlab Proxmox VM answers ARP for it and beats MetalLB's speaker to
# the address. MetalLB still reports it as owned and announced, so the conflict is invisible
# from this side; the symptom is an address that works on the LAN and dies from the WAN once
# the router's cache flips. Cost an evening in Aug 2026. An address missing from this list
# means nobody wrote it down, NOT that nobody is using it — ARP it before pinning it.
#
# .226 is the only address in here the router forwards to from the internet: external 25565
# -> 192.168.0.226:25565. TCP only now — DREAD needed UDP on the same port number for Simple
# Voice Chat, and Valhelsia 6 ships no voice mod, so the UDP half of that forward can go.
# Do not reassign .226 without removing the forward first.

namespace: networking

pools:
  # Gateways and core platform endpoints. Pinned, so an address never moves under a
  # service that a DNS record or firewall rule points at.
  - name: platform-pool
    autoAssign: false
    addresses:
      - 192.168.0.201-192.168.0.209

  # Stable personal services. Pinned for the same reason.
  #
  # Intentionally has no nodeSelector: these services live on pve2 today but the pool must
  # keep working through the node recycle in migration phase 6. Constrain it only once the
  # node names are final.
  - name: services-pool
    autoAssign: false
    addresses:
      - 192.168.0.220-192.168.0.250
