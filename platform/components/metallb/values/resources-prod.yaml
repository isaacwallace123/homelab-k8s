# MetalLB address plan — see docs/architecture/networking.md §1.
#
# Router DHCP MUST end at .200. Everything below is static or MetalLB-owned.
#
#   .10 – .19   k8s nodes (static, cloud-init)
#   .201 – .209 platform-pool   pinned    gateways, ArgoCD
#   .210 – .219 games-pool      AUTO      one per published game server
#   .220 – .250 services-pool   pinned    dashboards, media, monitoring

namespace: networking

pools:
  # Gateways and core platform endpoints. Pinned, so an address never moves under a
  # service that a DNS record or firewall rule points at.
  - name: platform-pool
    autoAssign: false
    addresses:
      - 192.168.0.201-192.168.0.209

  # Stable personal services. Pinned for the same reason.
  #
  # Intentionally has no nodeSelector: these services live on pve2 today but the pool must
  # keep working through the node recycle in migration phase 6. Constrain it only once the
  # node names are final.
  - name: services-pool
    autoAssign: false
    addresses:
      - 192.168.0.220-192.168.0.250

  # The game fleet. autoAssign is TRUE here — servers are created and destroyed by the
  # GameServer Composition, which cannot sensibly pick addresses by hand.
  #
  # Previously this range was excluded with a comment reserving it for "the other Proxmox
  # k8s/agones cluster". No such cluster exists; the k8s nodes live at .10-.13. Reclaimed.
  - name: games-pool
    autoAssign: true
    addresses:
      - 192.168.0.210-192.168.0.219
    # Announced ONLY from the game node, which is on the cyberlab host. This is what keeps
    # player traffic from being announced by a pve2 node and forwarded back across the LAN.
    nodeSelectors:
      - homelab.isaacwallace.dev/pool: games
