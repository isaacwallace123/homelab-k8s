apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      # Media is pinned to the dedicated media node: it is the only one with the Arc A380
      # for transcoding, and it sits next to TrueNAS on pve2. The node is tainted so that
      # nothing else lands there and competes for the GPU or the NFS path.
      nodeSelector:
        homelab.isaacwallace.dev/pool: media
      # Two keys during the taxonomy migration. The taint is moving from
      # `workload=media` to `pool=media` so it matches the label it pairs with; a pod
      # cannot tolerate a taint it does not yet know about, so both are carried until
      # every media node has been re-tainted. The `workload` entry is then removed.
      tolerations:
        - key: homelab.isaacwallace.dev/pool
          operator: Equal
          value: media
          effect: NoSchedule
        - key: homelab.isaacwallace.dev/workload
          operator: Equal
          value: media
          effect: NoSchedule
      containers:
        - name: plex
          image: lscr.io/linuxserver/plex:1.43.3.10828-00f62d37d-ls315
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/New_York
            # Arc (DG2) transcoding needs Intel's iHD VA driver, which this image does not
            # ship — /usr/lib/x86_64-linux-gnu/dri is empty and the transcoder fails with
            # "No VA display found for device /dev/dri/renderD128" even though the render
            # node is present and permissions are correct.
            #
            # LinuxServer's universal-package-install mod adds it at container start, which
            # keeps this declarative instead of maintaining a forked image.
            - name: DOCKER_MODS
              value: linuxserver/mods:universal-package-install
            - name: INSTALL_PACKAGES
              value: intel-media-va-driver-non-free|vainfo
            # iHD is the driver for Gen12+ / Arc. i965 is the legacy one and does not
            # support DG2, so leaving the choice to autodetection can pick the wrong one.
            - name: LIBVA_DRIVER_NAME
              value: iHD
            - name: VERSION
              value: docker
            - name: ADVERTISE_IP
              value: "http://192.168.0.230:32400/"
          ports:
            - containerPort: 32400
          readinessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /identity
              port: 32400
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /config
            - name: movies
              mountPath: /movies
            - name: tv
              mountPath: /tv
            - name: dri
              mountPath: /dev/dri
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: config-plex
        - name: movies
          persistentVolumeClaim:
            claimName: tank-movies
        - name: tv
          persistentVolumeClaim:
            claimName: tank-tv
        - name: dri
          hostPath:
            path: /dev/dri
---
# Web UI — accessible at http://192.168.0.230:32400/web
apiVersion: v1
kind: Service
metadata:
  name: plex
  namespace: media
  annotations:
    metallb.io/loadBalancerIPs: "192.168.0.230"
    metallb.io/allow-shared-ip: "media-stack"
spec:
  type: LoadBalancer
  selector:
    app: plex
  ports:
    - port: 32400
      targetPort: 32400
