{{/*
mc-router — one IP and one port for the whole Minecraft fleet.

Minecraft Java's handshake carries the hostname the client typed. mc-router reads it and
picks a backend, so every server shares 25565 and players connect with a name rather than
a port number:

    atm10.mc.isaacwallace.dev  ─┐
    smp.mc.isaacwallace.dev    ─┼─▶  mc-router :25565  ─▶  correct backend Service
    creative.mc...             ─┘

With --in-kube-cluster it discovers backends by watching Services annotated
mc-router.itzg.me/externalServerName, which the GameServer Composition sets from
spec.network.hostnames. There is no router configuration to maintain.

It also refuses connections that do not name a mapped host, which drops the constant
background noise of Minecraft port scanners.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mc-router
  namespace: {{ .Values.namespace }}
---
# Watching Services across the game namespaces is the whole discovery mechanism, so this
# has to be cluster-scoped. It is read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mc-router
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mc-router
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mc-router
subjects:
  - kind: ServiceAccount
    name: mc-router
    namespace: {{ .Values.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mc-router
  namespace: {{ .Values.namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mc-router
  template:
    metadata:
      labels:
        app: mc-router
    spec:
      serviceAccountName: mc-router
      nodeSelector:
        homelab.isaacwallace.dev/pool: games
      tolerations:
        - key: homelab.isaacwallace.dev/pool
          operator: Equal
          value: games
          effect: NoSchedule
      containers:
        - name: mc-router
          image: {{ .Values.image }}
          args:
            - --in-kube-cluster
            - --api-binding
            - :8080
            {{- if .Values.connectionRateLimit }}
            - --connection-rate-limit
            - {{ .Values.connectionRateLimit | quote }}
            {{- end }}
          ports:
            - name: minecraft
              containerPort: 25565
              protocol: TCP
            - name: api
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mc-router
  namespace: {{ .Values.namespace }}
  annotations:
    metallb.io/address-pool: games-pool
    metallb.io/loadBalancerIPs: {{ .Values.address | quote }}
spec:
  type: LoadBalancer
  # Preserves the player's source IP through to the router, which is what its rate
  # limiting and the backends' IP bans both depend on.
  externalTrafficPolicy: Local
  selector:
    app: mc-router
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
