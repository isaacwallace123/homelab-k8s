# =============================================================================
# Assemble the kubeconfig the `gameops` ProviderConfig authenticates with.
#
# WHY A JOB
#
# provider-kubernetes authenticates a ProviderConfig one of two ways: InjectedIdentity,
# which uses the provider pod's own ServiceAccount, or a Secret holding a full kubeconfig.
# InjectedIdentity means every ProviderConfig shares one identity — which is exactly the
# single-god-mode-provider arrangement this design avoids.
#
# So `gameops` uses a kubeconfig Secret. That kubeconfig has to embed the ServiceAccount's
# token, and the token's value is not known until Kubernetes mints it, which is after
# apply time. A short Job that reads the token and writes the kubeconfig is the smallest
# honest way to close that gap declaratively.
#
# It runs once. The token does not rotate, so re-running only rewrites the same content.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gameops-kubeconfig-bootstrap
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gameops-kubeconfig-bootstrap
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  # Read exactly one secret (the SA token) and write exactly one (the kubeconfig).
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
    resourceNames: ["gameops-token", "gameops-kubeconfig"]
  # `create` cannot be restricted by resourceName — the object does not exist yet to be
  # named. Scoped to this namespace by the Role itself.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gameops-kubeconfig-bootstrap
  namespace: crossplane-system
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gameops-kubeconfig-bootstrap
subjects:
  - kind: ServiceAccount
    name: gameops-kubeconfig-bootstrap
    namespace: crossplane-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gameops-kubeconfig-bootstrap
  namespace: crossplane-system
  annotations:
    # Wave 2: after the ServiceAccount and token Secret (wave 1), before the
    # ProviderConfig that reads the result (wave 3).
    argocd.argoproj.io/sync-wave: "2"
    # A completed Job is immutable, so a re-sync must replace it rather than patch it.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 6
  template:
    metadata:
      name: gameops-kubeconfig-bootstrap
    spec:
      serviceAccountName: gameops-kubeconfig-bootstrap
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
      containers:
        - name: bootstrap
          image: bitnami/kubectl:1.34
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          command:
            - /bin/bash
            - -ec
            - |
              # The token controller populates the Secret asynchronously; wait for it
              # rather than racing and writing an empty kubeconfig.
              for i in $(seq 1 30); do
                TOKEN=$(kubectl get secret gameops-token -n crossplane-system \
                          -o jsonpath='{.data.token}' 2>/dev/null || true)
                [ -n "$TOKEN" ] && break
                echo "waiting for the gameops-token secret to be populated ($i/30)"
                sleep 2
              done

              if [ -z "$TOKEN" ]; then
                echo "gameops-token was never populated; refusing to write an empty kubeconfig" >&2
                exit 1
              fi

              CA=$(kubectl get secret gameops-token -n crossplane-system \
                     -o jsonpath='{.data.ca\.crt}')

              cat > /tmp/kubeconfig <<EOF
              apiVersion: v1
              kind: Config
              clusters:
                - name: in-cluster
                  cluster:
                    server: https://kubernetes.default.svc
                    certificate-authority-data: ${CA}
              users:
                - name: gameops
                  user:
                    token: $(echo "$TOKEN" | base64 -d)
              contexts:
                - name: gameops
                  context:
                    cluster: in-cluster
                    user: gameops
              current-context: gameops
              EOF

              kubectl create secret generic gameops-kubeconfig \
                -n crossplane-system \
                --from-file=kubeconfig=/tmp/kubeconfig \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "gameops-kubeconfig written."
      volumes:
        - name: tmp
          emptyDir: {}
