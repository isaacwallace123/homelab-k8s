apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homeops:provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homeops:provider-kubernetes
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
---
# ── cloud: the personal-cloud tier ────────────────────────────────────────────
# What the Database Composition needs to compose a CloudNativePG Cluster, and nothing
# else. Scoped to the CNPG API group plus the Secrets CNPG generates for connection
# details — NOT secrets cluster-wide, which is the difference between this and simply
# reusing cluster-admin.
#
# Deliberately absent: pods, exec, and any workload API. CNPG's operator creates the
# StatefulSet and the pods; Crossplane only declares the Cluster and reads back its
# status. If a Composition ever needs more than this, that is a signal the Composition is
# doing the operator's job.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud:provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "databases", "scheduledbackups", "backups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # CNPG writes the `<cluster>-app` connection Secret; the Composition publishes its name
  # in status so apps never have to know CNPG's naming convention.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud:provider-kubernetes
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloud:provider-kubernetes
subjects:
  - kind: ServiceAccount
    name: provider-kubernetes
    namespace: crossplane-system
