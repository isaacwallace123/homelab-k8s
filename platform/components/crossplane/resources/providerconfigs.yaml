# =============================================================================
# ProviderConfigs — wave 3, after the provider packages have registered their CRDs.
#
# SkipDryRunOnMissingResource lets the first sync get this far even though the CRD does
# not exist yet; ArgoCD then reconciles it on a later pass.
# =============================================================================

# ── homeops: the Operations Arena ─────────────────────────────────────────────
# InjectedIdentity uses the provider pod's own mounted ServiceAccount token — the
# `provider-kubernetes` SA bound to homeops:provider-kubernetes.
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: homeops
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: InjectedIdentity
---
# ── cloud: the personal-cloud tier ────────────────────────────────────────────
# Used by the Database Composition to compose CloudNativePG Clusters in the `cloud`
# namespace. Separate from `homeops` so a bug in a Database Composition cannot reach the
# arena's namespaces, and so its ClusterRole can be scoped to CNPG resources alone.
apiVersion: kubernetes.crossplane.io/v1alpha1
kind: ProviderConfig
metadata:
  name: cloud
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  credentials:
    source: InjectedIdentity
---
# ── garage: the object store's admin API ──────────────────────────────────────
# Drives bucket and key lifecycle for the Bucket Composition.
#
# CHICKEN AND EGG: this points at a Service that only exists once the garage component has
# synced, and authenticates with a token from the `garage-auth` secret. Both live in the
# `cloud` namespace, which is why garage sits at the apps tier and the platform-api tier
# that consumes it reconciles later. On a cold bootstrap this ProviderConfig reports
# unhealthy until Garage is up; that is expected and self-resolves.
# NOTE the API version: the provider serves ProviderConfig at v1 while its managed
# resources (Bucket, Key, KeyAccess) are v1alpha1. Assuming they matched is what made this
# fail to apply with "no matches for kind ProviderConfig in version .../v1alpha1".
apiVersion: garage.crossplane.io/v1
kind: ProviderConfig
metadata:
  name: garage
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  endpoint: http://garage.cloud.svc.cluster.local:3903
  credentials:
    source: Secret
    secretRef:
      namespace: cloud
      name: garage-auth
      key: admin-token
