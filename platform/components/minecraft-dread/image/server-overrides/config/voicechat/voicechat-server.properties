# Simple Voice Chat — server side. Applied OVER the pack's config by the server-extras
# overlay, so it wins over whatever the CurseForge instance ships.
#
# Simple Voice Chat rewrites this file on startup: it appends every key it did not find,
# with that key's default and its own generated comments. Only the keys that need to differ
# from the default belong here, and these comments will not survive the first rewrite.
#
# voice_host is deliberately absent. It is the address the server TELLS clients to send
# audio to, and leaving it blank makes clients reuse the host they typed to join — which is
# exactly right here, because mc.isaacwallace.dev:24454/udp forwards to the same place as
# :25565/tcp. Set it only if the public voice port ever stops matching the internal one.

# Must match a UDP containerPort/Service port in minecraft.yaml.
#
# 25565, the same NUMBER as the game port but the UDP one — the game is TCP, so the two do
# not collide, and it means a single port forward covers both. The mod's documentation warns
# against exactly this, because UDP 25565 is also the server-query port and a collision there
# "may crash the server".
#
# That warning does not apply here, ON ONE CONDITION: query must stay off. ENABLE_QUERY is
# false in minecraft.yaml and is set explicitly rather than left to default, because turning
# it on is what would make this line dangerous. If you ever enable query, move this back to
# 24454 and add the second forward.
port=25565

# Blank = bind to server-ip from server.properties, which is itself unset, so the wildcard.
# The pod has one address; anything narrower risks binding before the CNI is ready.
bind_address=

# Horror pack: voices carry a bit further than the 48-block default, so a scream is heard
# before its owner is visible.
max_voice_distance=64.0

enable_groups=true
allow_recording=true

# Spectators talking to living players spoils a death. Both off.
spectator_interaction=false
spectator_player_possession=false

# Everyone joins with the pack, which bundles the mod, so a player without it is a
# misconfiguration rather than a guest. Left false anyway — being kicked with no
# explanation is a bad first impression, and the whitelist already gates who gets in.
force_voice_chat=false
