# RCON password for the server console.
#
# RCON listens on 25575 and is deliberately NOT in the LoadBalancer Service — it is
# reachable only from inside the pod, which is where `kubectl exec ... rcon-cli` runs from.
# It still gets a real password: the games namespace has no default-deny NetworkPolicy
# (see minecraft.yaml for why it must not), so anything on the pod network could otherwise
# reach an unauthenticated console.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minecraft-rcon
  namespace: games
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: minecraft-rcon
      namespace: games
