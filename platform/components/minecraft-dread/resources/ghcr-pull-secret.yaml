# GHCR pull credentials for the private dread-server image.
#
# Generated by scripts/seal-ghcr-pull-secret.sh - do not hand-edit. To rotate, revoke the PAT
# on GitHub, mint a new one, and re-run that script.
#
# Encrypted to this cluster's sealed-secrets key: only the in-cluster controller can decrypt
# it, which is what makes committing this safe.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ghcr-pull
  namespace: games
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: ghcr-pull
      namespace: games
    type: kubernetes.io/dockerconfigjson
