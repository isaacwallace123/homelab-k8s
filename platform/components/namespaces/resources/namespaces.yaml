# homeops: control namespace for the public Operations Arena. Holds LabRun claims (the platform API
# the homelab.isaacwallace.dev run-broker submits); the disposable per-run namespaces Crossplane
# composes from those claims are created dynamically and are NOT declared here.
apiVersion: v1
kind: Namespace
metadata:
  name: homeops
---
# games: holds mc-router and the GameServer declarations themselves. The per-server
# `game-<name>` namespaces are composed by Crossplane and are NOT declared here — they are
# created and garbage-collected with their GameServer.
apiVersion: v1
kind: Namespace
metadata:
  name: games
  labels:
    homelab.isaacwallace.dev/exposure: internal
