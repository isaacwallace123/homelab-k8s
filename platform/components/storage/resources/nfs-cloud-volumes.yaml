# ── Cloud tier ────────────────────────────────────────────────────────────────
# Bulk storage for the cloud namespace, on the same TrueNAS box that serves media.
#
# THESE DATASETS MUST EXIST AND BE EXPORTED BEFORE THIS SYNCS. An NFS PV binds happily
# against a path that does not exist and only fails at mount time, inside the consuming
# pod, as a ContainerCreating that never resolves. On TrueNAS:
#
#   zfs create tank/cloud
#   zfs create tank/cloud/garage
#   zfs create tank/cloud/immich
#   chown -R 1000:1000 /mnt/tank/cloud
#
# and add each as an NFS share with **maproot_user=root, maproot_group=root**.
#
# That differs from the media exports, which leave maproot off and work fine because
# media-stack runs every container as PUID/PGID 1000. The cloud tier does not:
#
#   garage  runs as root and writes its block store directly
#
# Under root_squash it gets "Permission denied" no matter who owns the dataset, failing
# with `IO error: Permission denied (os error 13)` right after initialising the block
# manager.
#
# NOTE: changing maproot on an existing share does not affect already-mounted clients.
# The consuming pod has to be deleted so the kubelet remounts.
#
# Reclaim policy is Retain on all of them. These hold the only copy of photos and files;
# a deleted PVC must never take the dataset with it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tank-cloud-garage
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: cloud
    name: tank-cloud-garage
  nfs:
    server: 192.168.0.252
    path: /mnt/tank/cloud/garage
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tank-cloud-garage
  namespace: cloud
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: tank-cloud-garage
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: tank-cloud-immich
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: cloud
    name: tank-cloud-immich
  nfs:
    server: 192.168.0.252
    path: /mnt/tank/cloud/immich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tank-cloud-immich
  namespace: cloud
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: tank-cloud-immich
  resources:
    requests:
      storage: 2Ti
