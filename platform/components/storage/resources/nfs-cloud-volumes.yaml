    path: /mnt/tank/cloud/nextcloud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tank-cloud-nextcloud
  namespace: cloud
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: tank-cloud-nextcloud
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolume
